<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VendaAI - Entrar</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><div class="container" style="max-width:560px;padding-top:70px"><div class="logo" style="margin-bottom:22px">Venda<span>AI</span></div><div class="box"><h1 style="font-size:30px">Entrar</h1><p class="sub">Acesse sua conta.</p><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="senha" type="password"><button class="btn-full" onclick="entrar()">Entrar</button><div class="divider"></div><button class="btn-full btn-secondary" onclick="criar()">Criar conta</button><button class="btn-full btn-secondary" style="margin-top:10px" onclick="recuperar()">Esqueci minha senha</button><p id="msg" class="muted small" style="margin-top:12px"></p></div></div><script>async function entrar(){const {error}=await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:senha.value});msg.textContent=error?error.message:'';if(!error)location.href='index.html'}async function criar(){const {error}=await supabaseClient.auth.signUp({email:email.value.trim(),password:senha.value,options:{emailRedirectTo:location.origin+'/login.html'}});msg.textContent=error?error.message:'Conta criada. Se necessário, confirme pelo e-mail.'}async function recuperar(){if(!email.value.trim()){msg.textContent='Digite seu e-mail primeiro.';return}const {error}=await supabaseClient.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+'/reset.html'});msg.textContent=error?error.message:'Link enviado.'}</script></body></html>
