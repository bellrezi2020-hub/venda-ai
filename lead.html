<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VendaAI - Lead</title><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
</head><body><div id="nav"></div><div class="container">
<a href="leads.html" class="muted">← Voltar para leads</a><h1 id="titulo" style="margin-top:16px">Lead</h1><p id="sub" class="sub"></p>
<div class="grid-2">
<div class="box"><h2>Ficha comercial</h2>
<label>Status</label><select id="status"><option>Novo</option><option>Em contato</option><option>Visita marcada</option><option>Fechado</option><option>Perdido</option></select>
<label>Observações</label><textarea id="notes"></textarea><button class="btn-full" onclick="salvar()">Salvar alterações</button></div>
<div class="box"><h2>Análise da IA</h2><div id="analise"></div></div>
</div>
<div class="box"><h2>💬 Conversa</h2><div id="chat" class="chat"></div><div class="divider"></div>
<textarea id="nova" placeholder="Digite a nova mensagem do cliente..."></textarea><button id="btnChat" class="btn-full" onclick="continuar()">Continuar conversa com IA</button></div>
</div>
<script>
document.getElementById("nav").innerHTML=nav("leads");const id=new URLSearchParams(location.search).get("id");let lead,company;
(async()=>{await requireAuth();company=await currentCompany();const {data}=await supabaseClient.from("leads").select("*").eq("id",id).eq("company_id",company.id).single();lead=data;if(!lead){alert("Lead não encontrado");location.href="leads.html";return}render()})();
function render(){
 titulo.textContent=lead.name;sub.textContent=lead.original_message;status.value=lead.status||"Novo";notes.value=lead.notes||"";
 analise.innerHTML=`<p><strong>Temperatura:</strong> <span class="${normalizar(lead.temperature)}">${esc(lead.temperature)}</span></p><p style="margin-top:10px"><strong>Intenção:</strong> ${esc(lead.intent||"")}</p><p style="margin-top:10px"><strong>Resposta sugerida:</strong> ${esc(lead.suggested_reply||"")}</p><p style="margin-top:10px"><strong>Próximo passo:</strong> ${esc(lead.next_step||"")}</p>`;
 carregarMensagens();
}
async function salvar(){const {error}=await supabaseClient.from("leads").update({status:status.value,notes:notes.value.trim()}).eq("id",id);alert(error?error.message:"Salvo.");}
async function carregarMensagens(){
 const {data}=await supabaseClient.from("messages").select("*").eq("lead_id",id).order("created_at");
 chat.innerHTML=(data||[]).map(m=>`<div class="msg ${m.role==="user"?"user":"ai"}">${esc(m.content)}</div>`).join("");
 chat.scrollTop=chat.scrollHeight;
}
async function continuar(){
 const texto=nova.value.trim();if(!texto)return;btnChat.disabled=true;
 await supabaseClient.from("messages").insert({lead_id:id,role:"user",content:texto});
 const {data:msgs}=await supabaseClient.from("messages").select("*").eq("lead_id",id).order("created_at");
 const {data:props}=await supabaseClient.from("properties").select("*").eq("company_id",company.id);
 const r=await fetch("/api/conversar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lead,empresa:company,imoveis:props||[],mensagens:msgs||[]})});
 const d=await r.json();
 if(r.ok){await supabaseClient.from("messages").insert({lead_id:id,role:"assistant",content:d.resposta});await supabaseClient.from("leads").update({temperature:d.status||lead.temperature,intent:d.intencao||lead.intent,next_step:d.proximoPasso||lead.next_step,match_count:d.imoveisCompativeis?.length||lead.match_count,matches:d.imoveisCompativeis||lead.matches}).eq("id",id);lead.temperature=d.status||lead.temperature;lead.intent=d.intencao||lead.intent;lead.next_step=d.proximoPasso||lead.next_step;}
 nova.value="";btnChat.disabled=false;render();
}
</script></body></html>
