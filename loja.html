<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loja — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261014-0100"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="favoritos.html">Favoritos</a><a href="perfil.html">Meu perfil</a><a href="minhas-reservas.html">Reservas</a></nav></header><main class="wrap section" id="app"><div class="notice">Carregando loja...</div></main><script>
let user=null,store=null,following=false;
(async()=>{const app=document.getElementById('app');const id=new URLSearchParams(location.search).get('id');if(!id)return app.innerHTML='<div class="notice warn">Loja não informada.</div>';const[{data:s,error},{data:items}]=await Promise.all([marketplaceDb.from('marketplace_stores').select('*').eq('id',id).maybeSingle(),marketplaceDb.from('marketplace_listings').select('*,marketplace_listing_media(url)').eq('store_id',id).eq('status','active').order('created_at',{ascending:false})]);if(error||!s)return app.innerHTML='<div class="notice warn">Loja não encontrada.</div>';store=s;try{const ses=await MP.session();user=ses?.user||null}catch(e){}if(user&&user.id!==s.owner_id){const f=await marketplaceDb.from('marketplace_store_followers').select('store_id').eq('user_id',user.id).eq('store_id',s.id).maybeSingle();following=!!f.data}app.innerHTML='<div class="card"><div class="row"><div class="store"><div class="avatar" style="width:72px;height:72px;font-size:24px">'+MP.esc((s.public_name||s.name).slice(0,1))+'</div><div><h1 style="margin:0">'+MP.esc(s.public_name||s.name)+'</h1><div class="muted">'+(s.verified?'✓ Loja verificada • ':'')+'⭐ '+Number(s.rating||0).toFixed(1)+' • '+MP.esc([s.city,s.state].filter(Boolean).join(' - '))+'</div></div></div>'+(user&&user.id!==s.owner_id?'<button id="followBtn" class="btn ghost" onclick="toggleFollow()">'+(following?'✓ Seguindo':'+ Seguir loja')+'</button>':'')+'</div><p class="muted" style="margin-top:16px">'+MP.esc(s.description||'Loja na VendaAI.')+(s.service_region?'<div class="muted small" style="margin-top:8px">📍 Atende: '+MP.esc(s.service_region)+'</div>':'')+'</p><div class="trust"><span id="followerCount">'+Number(s.followers_count||0)+' seguidores</span><span>'+Number(s.sales_count||0)+' vendas</span>'+(s.founder_badge?'<span>Fundador VendaAI</span>':'')+'</div></div><section class="section"><div class="section-head"><div><h2>Todos os anúncios</h2></div></div><div id="cards" class="grid g4"></div></section>';document.getElementById('cards').innerHTML=(items||[]).map(x=>{const img=x.marketplace_listing_media?.[0]?.url;return '<article class="card product-card"><div class="product-img">'+(img?'<img src="'+MP.esc(img)+'" style="width:100%;height:100%;object-fit:cover">':MP.categoryEmoji(x.category))+'</div><div class="product-body"><h3>'+MP.esc(x.title)+'</h3><div class="price">'+MP.money(x.price)+'</div><a class="btn ghost" style="width:100%;margin-top:12px" href="anuncio.html?id='+x.id+'">Ver anúncio</a></div></article>'}).join('')||'<div class="notice">Essa loja ainda não tem anúncios ativos.</div>'})();
async function toggleFollow(){if(!user){location.href='login.html?next='+encodeURIComponent(location.pathname.split('/').pop()+location.search);return}if(following){const{error}=await marketplaceDb.from('marketplace_store_followers').delete().eq('user_id',user.id).eq('store_id',store.id);if(error)return alert(error.message);following=false;store.followers_count=Math.max(0,Number(store.followers_count||0)-1)}else{const{error}=await marketplaceDb.from('marketplace_store_followers').insert({user_id:user.id,store_id:store.id});if(error)return alert(error.message);following=true;store.followers_count=Number(store.followers_count||0)+1}followBtn.textContent=following?'✓ Seguindo':'+ Seguir loja';followerCount.textContent=store.followers_count+' seguidores'}
</script></body></html>
