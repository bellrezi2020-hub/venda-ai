<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loja — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="vender.html">Vender</a></nav></header><main class="wrap section" id="app"><div class="notice">Carregando loja...</div></main><script>(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id)return app.innerHTML='<div class="notice warn">Loja não informada.</div>';const[{data:s,error},{data:items}]=await Promise.all([marketplaceDb.from('marketplace_stores').select('*').eq('id',id).maybeSingle(),marketplaceDb.from('marketplace_listings').select('*').eq('store_id',id).eq('status','active').order('created_at',{ascending:false})]);if(error||!s)return app.innerHTML='<div class="notice warn">Loja não encontrada.</div>';app.innerHTML='<div class="card"><div class="store"><div class="avatar" style="width:72px;height:72px;font-size:24px">'+MP.esc(s.name.slice(0,1))+'</div><div><h1 style="margin:0">'+MP.esc(s.name)+'</h1><div class="muted">'+(s.verified?'✓ Loja verificada • ':'')+'⭐ '+Number(s.rating||0).toFixed(1)+' • '+MP.esc([s.city,s.state].filter(Boolean).join(' - '))+'</div></div></div><div class="trust"><span>'+Number(s.sales_count||0)+' vendas</span>'+(s.founder_badge?'<span>Fundador VendaAI</span>':'')+'</div></div><section class="section"><div class="section-head"><div><h2>Todos os anúncios</h2></div></div><div id="cards" class="grid g4"></div></section>';document.getElementById('cards').innerHTML=(items||[]).map(x=>'<article class="card product-card"><div class="product-img">'+MP.categoryEmoji(x.category)+'</div><div class="product-body"><h3>'+MP.esc(x.title)+'</h3><div class="price">'+MP.money(x.price)+'</div><a class="btn ghost" style="width:100%;margin-top:12px" href="anuncio.html?id='+x.id+'">Ver anúncio</a></div></article>').join('')||'<div class="notice">Essa loja ainda não tem anúncios ativos.</div>'})();</script></body></html>
