<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anúncio — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261013-1825"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="seguranca.html">Segurança</a><a href="minhas-negociacoes.html">Negociações</a></nav></header><main class="wrap section" id="app"><div class="notice">Carregando anúncio...</div></main><script>
let listing=null,user=null;
(async()=>{const app=document.getElementById('app');const id=new URLSearchParams(location.search).get('id');if(!id){app.innerHTML='<div class="notice warn">Anúncio não informado.</div>';return}const{data:x,error}=await marketplaceDb.from('marketplace_listings').select('*,marketplace_stores(*),marketplace_listing_media(url)').eq('id',id).maybeSingle();if(error||!x){app.innerHTML='<div class="notice warn">Anúncio não encontrado ou ainda não foi aprovado.</div>';return}listing=x;try{const s=await MP.session();user=s?.user||null}catch(e){}const img=x.marketplace_listing_media?.[0]?.url;const own=user?.id===x.seller_id;app.innerHTML='<div class="split"><div><div class="card" style="height:420px;padding:0;overflow:hidden;display:grid;place-items:center;font-size:100px">'+(img?'<img src="'+MP.esc(img)+'" style="width:100%;height:100%;object-fit:cover">':MP.categoryEmoji(x.category))+'</div><div class="card" style="margin-top:16px"><h2>Descrição</h2><p class="muted">'+MP.esc(x.description||'Sem descrição.')+'</p><div class="trust"><span>🛡️ Negociação dentro da VendaAI</span><span>⭐ Avaliações públicas</span></div></div></div><aside class="card sticky-card">'+(x.marketplace_stores?.verified?'<span class="tag ok">✓ loja verificada</span>':'<span class="tag">Novo vendedor</span>')+'<h1>'+MP.esc(x.title)+'</h1><div class="price">'+MP.money(x.price)+'</div><p class="muted">'+MP.esc([x.city,x.state].filter(Boolean).join(' - '))+'</p><a href="loja.html?id='+encodeURIComponent(x.store_id)+'" class="store" style="text-decoration:none"><div class="avatar">'+MP.esc((x.marketplace_stores?.name||'V').slice(0,1))+'</div><div><strong>'+MP.esc(x.marketplace_stores?.name||'Vendedor')+'</strong><div class="muted">ver loja</div></div></a>'+(own?'<div class="notice" style="margin-top:16px">Este anúncio é seu.</div>':'<button class="btn" style="width:100%;margin-top:16px" onclick="alert(\'Pagamento entra na etapa financeira.\')">Comprar dentro da VendaAI</button>'+(x.allows_offers?'<button class="btn secondary" style="width:100%;margin-top:8px" onclick="makeOffer()">Fazer proposta</button>':'')+'<button class="btn ghost" style="width:100%;margin-top:8px" onclick="openChat()">Conversar com vendedor</button>')+'<p id="actionMsg" class="muted small" style="margin-top:10px"></p></aside></div>';})();
async function ensureLogin(){const u=await MP.requireUser('anuncio.html?id='+encodeURIComponent(listing.id));return u}
async function makeOffer(){try{const u=await ensureLogin();if(!u)return;if(u.id===listing.seller_id)return;const raw=prompt('Qual valor você quer oferecer? Ex.: 80,00');if(raw===null)return;const amount=Number(String(raw).replace('.','').replace(',','.'));if(!amount||amount<=0)return alert('Digite um valor válido.');const{error}=await marketplaceDb.from('marketplace_offers').insert({listing_id:listing.id,buyer_id:u.id,amount,status:'pending'});if(error)throw error;document.getElementById('actionMsg').textContent='✓ Proposta enviada ao vendedor.'}catch(e){alert(e.message||String(e))}}
async function openChat(){try{const u=await ensureLogin();if(!u)return;if(u.id===listing.seller_id)return;location.href='negociacao.html?listing='+encodeURIComponent(listing.id)}catch(e){alert(e.message||String(e))}}
</script></body></html>
