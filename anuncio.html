<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anúncio — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261014-0010"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="favoritos.html">Favoritos</a><a href="minhas-negociacoes.html">Negociações</a><a href="notificacoes.html">Notificações</a></nav></header><main class="wrap section" id="app"><div class="notice">Carregando anúncio...</div></main><script>
let listing=null,user=null,isFav=false,canReview=false;
(async()=>{const app=document.getElementById('app');const id=new URLSearchParams(location.search).get('id');if(!id){app.innerHTML='<div class="notice warn">Anúncio não informado.</div>';return}
const{data:x,error}=await marketplaceDb.from('marketplace_listings').select('*,marketplace_stores(*),marketplace_listing_media(url)').eq('id',id).maybeSingle();if(error||!x){app.innerHTML='<div class="notice warn">Anúncio não encontrado ou ainda não foi aprovado.</div>';return}listing=x;
try{const s=await MP.session();user=s?.user||null}catch(e){}
if(user){const fr=await marketplaceDb.from('marketplace_favorites').select('listing_id').eq('user_id',user.id).eq('listing_id',x.id).maybeSingle();isFav=!!fr.data;if(user.id!==x.seller_id){const cr=await marketplaceDb.from('marketplace_conversations').select('id').eq('listing_id',x.id).eq('buyer_id',user.id).eq('seller_id',x.seller_id).limit(1);canReview=(cr.data||[]).length>0}}
const rr=await marketplaceDb.from('marketplace_reviews').select('rating,comment,created_at').eq('reviewed_user_id',x.seller_id).eq('role','seller').order('created_at',{ascending:false}).limit(10);
const reviews=rr.data||[];const avg=reviews.length?(reviews.reduce((a,b)=>a+Number(b.rating||0),0)/reviews.length).toFixed(1):null;
const img=x.marketplace_listing_media?.[0]?.url;const own=user?.id===x.seller_id;
app.innerHTML='<div class="split"><div><div class="card" style="height:420px;padding:0;overflow:hidden;display:grid;place-items:center;font-size:100px">'+(img?'<img src="'+MP.esc(img)+'" style="width:100%;height:100%;object-fit:cover">':MP.categoryEmoji(x.category))+'</div><div class="card" style="margin-top:16px"><h2>Descrição</h2><p class="muted">'+MP.esc(x.description||'Sem descrição.')+'</p><div class="trust"><span>🛡️ Negociação dentro da VendaAI</span><span>⭐ '+(avg?avg+' de '+reviews.length+' avaliação(ões)':'Sem avaliações ainda')+'</span></div></div><div class="card" style="margin-top:16px"><h2>Avaliações do vendedor</h2><div id="reviews">'+(reviews.map(r=>'<div class="list-item"><strong>'+'⭐'.repeat(Number(r.rating||0))+'</strong><div class="muted">'+MP.esc(r.comment||'Sem comentário.')+'</div></div>').join('')||'<div class="muted">Ainda não há avaliações.</div>')+'</div></div></div><aside class="card sticky-card">'+(x.marketplace_stores?.verified?'<span class="tag ok">✓ loja verificada</span>':'<span class="tag">Novo vendedor</span>')+'<h1>'+MP.esc(x.title)+'</h1><div class="price">'+MP.money(x.price)+'</div><p class="muted">'+MP.esc([x.city,x.state].filter(Boolean).join(' - '))+'</p><a href="loja.html?id='+encodeURIComponent(x.store_id)+'" class="store" style="text-decoration:none"><div class="avatar">'+MP.esc((x.marketplace_stores?.name||'V').slice(0,1))+'</div><div><strong>'+MP.esc(x.marketplace_stores?.name||'Vendedor')+'</strong><div class="muted">ver loja</div></div></a>'+(own?'<div class="notice" style="margin-top:16px">Este anúncio é seu.</div>':'<button class="btn" style="width:100%;margin-top:16px" onclick="alert(\'Pagamento entra na etapa financeira.\')">Comprar dentro da VendaAI</button>'+(x.allows_offers?'<button class="btn secondary" style="width:100%;margin-top:8px" onclick="makeOffer()">Fazer proposta</button>':'')+'<button class="btn ghost" style="width:100%;margin-top:8px" onclick="openChat()">Conversar com vendedor</button><button id="favBtn" class="btn ghost" style="width:100%;margin-top:8px" onclick="toggleFavorite()">'+(isFav?'♥ Remover dos favoritos':'♡ Favoritar')+'</button>'+(canReview?'<button class="btn ghost" style="width:100%;margin-top:8px" onclick="reviewSeller()">⭐ Avaliar vendedor</button>':'')+'<button class="btn ghost" style="width:100%;margin-top:8px" onclick="reportListing()">⚑ Denunciar anúncio</button>')+'<p id="actionMsg" class="muted small" style="margin-top:10px"></p></aside></div>';})();
async function ensureLogin(){return await MP.requireUser('anuncio.html?id='+encodeURIComponent(listing.id))}
async function makeOffer(){try{const u=await ensureLogin();if(!u)return;if(u.id===listing.seller_id)return;const raw=prompt('Qual valor você quer oferecer? Ex.: 80,00');if(raw===null)return;const amount=Number(String(raw).replace('.','').replace(',','.'));if(!amount||amount<=0)return alert('Digite um valor válido.');const{error}=await marketplaceDb.from('marketplace_offers').insert({listing_id:listing.id,buyer_id:u.id,amount,status:'pending'});if(error)throw error;document.getElementById('actionMsg').textContent='✓ Proposta enviada ao vendedor.'}catch(e){alert(e.message||String(e))}}
async function openChat(){const u=await ensureLogin();if(!u)return;location.href='negociacao.html?listing='+encodeURIComponent(listing.id)}
async function toggleFavorite(){try{const u=await ensureLogin();if(!u)return;if(isFav){const{error}=await marketplaceDb.from('marketplace_favorites').delete().eq('user_id',u.id).eq('listing_id',listing.id);if(error)throw error;isFav=false}else{const{error}=await marketplaceDb.from('marketplace_favorites').insert({user_id:u.id,listing_id:listing.id});if(error)throw error;isFav=true}document.getElementById('favBtn').textContent=isFav?'♥ Remover dos favoritos':'♡ Favoritar'}catch(e){alert(e.message||String(e))}}
async function reportListing(){try{const u=await ensureLogin();if(!u)return;const reason=prompt('Motivo da denúncia (ex.: golpe, produto proibido, anúncio falso):');if(!reason)return;const details=prompt('Descreva o problema (opcional):')||'';const{error}=await marketplaceDb.from('marketplace_reports').insert({reporter_id:u.id,target_user_id:listing.seller_id,listing_id:listing.id,reason,details,status:'open'});if(error)throw error;document.getElementById('actionMsg').textContent='✓ Denúncia enviada para análise.'}catch(e){alert(e.message||String(e))}}
async function reviewSeller(){try{const u=await ensureLogin();if(!u)return;const raw=prompt('Nota para o vendedor de 1 a 5:');if(raw===null)return;const rating=Number(raw);if(!Number.isInteger(rating)||rating<1||rating>5)return alert('Use uma nota de 1 a 5.');const comment=prompt('Comentário (opcional):')||'';const{error}=await marketplaceDb.from('marketplace_reviews').insert({listing_id:listing.id,reviewer_id:u.id,reviewed_user_id:listing.seller_id,role:'seller',rating,comment});if(error)throw error;alert('Avaliação enviada.');location.reload()}catch(e){alert(e.message||String(e))}}
</script></body></html>
