<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Marketplace — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261014-0010"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="dashboard.html">CRM</a><a href="marketplace.html">Marketplace</a></nav></header><main class="wrap section"><div class="section-head"><div><h1>Painel Marketplace</h1><div class="muted">Revisão de anúncios e denúncias.</div></div></div><div id="gate" class="notice">Iniciando painel...</div><section id="area" class="section hidden"><div class="grid g4"><div class="card"><div class="muted">Em revisão</div><div class="kpi" id="reviewCount">0</div></div><div class="card"><div class="muted">Ativos</div><div class="kpi" id="activeCount">0</div></div><div class="card"><div class="muted">Bloqueados</div><div class="kpi" id="blockedCount">0</div></div><div class="card"><div class="muted">Denúncias abertas</div><div class="kpi" id="reportCount">0</div></div></div><section class="section"><div class="card"><h2>Fila de anúncios</h2><div id="queue"></div></div></section><section class="section"><div class="card"><h2>Denúncias</h2><div id="reports"></div></div></section></section></main><script>
const gateEl=document.getElementById('gate'),areaEl=document.getElementById('area'),queueEl=document.getElementById('queue'),reportsEl=document.getElementById('reports'),reviewEl=document.getElementById('reviewCount'),activeEl=document.getElementById('activeCount'),blockedEl=document.getElementById('blockedCount'),reportEl=document.getElementById('reportCount');
function safeText(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
async function loadQueue(){const{data,error}=await marketplaceDb.from('marketplace_listings').select('*,marketplace_stores(name)').order('created_at',{ascending:false});if(error)throw error;const items=data||[];reviewEl.textContent=items.filter(x=>x.status==='review').length;activeEl.textContent=items.filter(x=>x.status==='active').length;blockedEl.textContent=items.filter(x=>x.status==='blocked').length;const pending=items.filter(x=>x.status==='review');queueEl.innerHTML=pending.map(x=>'<div class="card" style="margin:10px 0;background:#0d131b"><div class="row"><div><strong>'+safeText(x.title)+'</strong><div class="muted">'+safeText(x.marketplace_stores?.name||'Vendedor')+' • '+Number(x.price||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})+' • '+safeText([x.city,x.state].filter(Boolean).join(' - '))+'</div></div><div><button class="btn success" onclick="setStatus(\''+x.id+'\',\'active\')">Aprovar</button> <button class="btn btn-danger" onclick="setStatus(\''+x.id+'\',\'blocked\')">Bloquear</button></div></div></div>').join('')||'<div class="notice">Nenhum anúncio aguardando revisão.</div>'}
async function loadReports(){const{data,error}=await marketplaceDb.from('marketplace_reports').select('*,marketplace_listings(id,title,status)').order('created_at',{ascending:false});if(error)throw error;const a=data||[];reportEl.textContent=a.filter(x=>x.status==='open'||x.status==='review').length;reportsEl.innerHTML=a.map(r=>'<div class="card" style="margin:10px 0;background:#0d131b"><div class="row"><div><strong>'+safeText(r.reason)+'</strong><div class="muted">'+safeText(r.marketplace_listings?.title||'Sem anúncio')+' • '+safeText(r.details||'Sem detalhes')+'</div><span class="status '+(r.status==='resolved'?'green':r.status==='dismissed'?'red':'yellow')+'">'+safeText(r.status)+'</span></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+(r.listing_id?'<a class="btn ghost" href="anuncio.html?id='+encodeURIComponent(r.listing_id)+'">Ver anúncio</a>':'')+(r.marketplace_listings?.status!=='blocked'&&r.listing_id?'<button class="btn btn-danger" onclick="blockFromReport(\''+r.id+'\',\''+r.listing_id+'\')">Bloquear anúncio</button>':'')+'<button class="btn success" onclick="setReport(\''+r.id+'\',\'resolved\')">Resolver</button><button class="btn secondary" onclick="setReport(\''+r.id+'\',\'dismissed\')">Descartar</button></div></div></div>').join('')||'<div class="notice">Nenhuma denúncia registrada.</div>'}
async function setStatus(id,status){const{error}=await marketplaceDb.from('marketplace_listings').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await loadQueue()}
async function setReport(id,status){const{error}=await marketplaceDb.from('marketplace_reports').update({status}).eq('id',id);if(error)return alert(error.message);await loadReports()}
async function blockFromReport(reportId,listingId){const a=await marketplaceDb.from('marketplace_listings').update({status:'blocked',updated_at:new Date().toISOString()}).eq('id',listingId);if(a.error)return alert(a.error.message);await marketplaceDb.from('marketplace_reports').update({status:'resolved'}).eq('id',reportId);await Promise.all([loadQueue(),loadReports()])}
(async()=>{try{gateEl.textContent='Lendo sua sessão...';if(!await MP.isAdmin())throw new Error('Esta conta não tem acesso administrativo.');areaEl.classList.remove('hidden');await Promise.all([loadQueue(),loadReports()]);gateEl.className='notice ok';gateEl.textContent='✓ Painel administrativo carregado.'}catch(err){areaEl.classList.add('hidden');gateEl.className='notice warn';gateEl.innerHTML='<strong>Não consegui abrir o painel.</strong><br>'+safeText(err?.message||String(err))}})();
</script></body></html>
