<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda do vendedor — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261014-0630"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="vendedor-painel.html">Meu painel</a><a href="configurar-loja.html">Configurar loja</a><a href="notificacoes.html">Notificações</a></nav></header><main class="wrap section"><div class="section-head"><div><h1>Agenda de serviços</h1><div class="muted">Abra horários e confirme reservas sem tirar o cliente da VendaAI.</div></div></div><div id="status" class="notice">Carregando...</div><section id="area" class="section hidden"><div class="grid g2"><div class="card"><h2>Abrir horário</h2><div class="field"><label>Serviço</label><select id="listing" class="input"></select></div><div class="field"><label>Data e hora</label><input id="start" type="datetime-local" class="input"></div><div class="field"><label>Duração</label><select id="duration" class="input"><option value="30">30 min</option><option value="60" selected>1 hora</option><option value="90">1h30</option><option value="120">2 horas</option></select></div><button class="btn" style="margin-top:14px" onclick="addSlot()">Adicionar horário</button><p id="slotMsg" class="muted"></p><div class="divider"></div><h3>Próximos horários</h3><div id="slots"></div></div><div class="card"><h2>Reservas recebidas</h2><div id="bookings"></div></div></div></section></main><script>
let user=null,services=[];const fmt=v=>new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const labels={pending:'Solicitada',confirmed:'Confirmada',completed:'Concluída',cancelled_buyer:'Cancelada pelo cliente',cancelled_seller:'Cancelada por você',no_show:'Não compareceu'};
(async()=>{try{user=await MP.requireUser('agenda-vendedor.html');if(!user)return;const{data,error}=await marketplaceDb.from('marketplace_listings').select('id,title').eq('seller_id',user.id).eq('category','services').in('status',['active','paused']).order('title');if(error)throw error;services=data||[];listing.innerHTML=services.map(x=>'<option value="'+x.id+'">'+MP.esc(x.title)+'</option>').join('');if(!services.length)throw new Error('Crie e aprove pelo menos um anúncio da categoria Serviços para usar a agenda.');listing.onchange=loadSlots;await Promise.all([loadSlots(),loadBookings()]);document.getElementById('area').classList.remove('hidden');const s=document.getElementById('status');s.className='notice ok';s.textContent='✓ Agenda pronta.'}catch(e){const s=document.getElementById('status');s.className='notice warn';s.textContent=e.message||String(e)}})();
async function addSlot(){if(!start.value)return slotMsg.textContent='Escolha a data e hora.';const begins=new Date(start.value);if(begins<=new Date())return slotMsg.textContent='Escolha um horário futuro.';const ends=new Date(begins.getTime()+Number(duration.value)*60000);const{error}=await marketplaceDb.from('marketplace_availability_slots').insert({listing_id:listing.value,seller_id:user.id,starts_at:begins.toISOString(),ends_at:ends.toISOString(),status:'available'});slotMsg.textContent=error?error.message:'✓ Horário aberto.';if(!error){start.value='';loadSlots()}}
async function loadSlots(){if(!listing.value)return;const{data,error}=await marketplaceDb.from('marketplace_availability_slots').select('*').eq('listing_id',listing.value).gte('starts_at',new Date().toISOString()).order('starts_at');if(error){slots.textContent=error.message;return}slots.innerHTML=(data||[]).map(s=>'<div class="list-item row"><div><strong>'+fmt(s.starts_at)+'</strong><div class="muted">'+MP.esc(s.status)+'</div></div>'+(s.status==='available'?'<button class="btn btn-danger" onclick="removeSlot(\''+s.id+'\')">Remover</button>':'')+'</div>').join('')||'<div class="muted">Nenhum horário aberto.</div>'}
async function removeSlot(id){const{error}=await marketplaceDb.from('marketplace_availability_slots').delete().eq('id',id).eq('seller_id',user.id);if(error)return alert(error.message);loadSlots()}
async function loadBookings(){const{data,error}=await marketplaceDb.from('marketplace_bookings').select('*,marketplace_listings(id,title)').eq('seller_id',user.id).order('starts_at',{ascending:false});if(error){bookings.textContent=error.message;return}bookings.innerHTML=(data||[]).map(b=>'<div class="list-item"><strong>'+MP.esc(b.marketplace_listings?.title||'Serviço')+'</strong><div class="muted">'+fmt(b.starts_at)+'</div><span class="status '+(b.status==='confirmed'||b.status==='completed'?'green':b.status.startsWith('cancelled')?'red':'yellow')+'">'+MP.esc(labels[b.status]||b.status)+'</span>'+(b.buyer_note?'<div class="muted small" style="margin-top:7px">Cliente: '+MP.esc(b.buyer_note)+'</div>':'')+'<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">'+(b.status==='pending'?'<button class="btn success" onclick="setBooking(\''+b.id+'\',\'confirmed\')">Confirmar</button><button class="btn btn-danger" onclick="setBooking(\''+b.id+'\',\'cancelled_seller\')">Recusar</button>':b.status==='confirmed'?'<button class="btn success" onclick="setBooking(\''+b.id+'\',\'completed\')">Concluir</button><button class="btn secondary" onclick="setBooking(\''+b.id+'\',\'no_show\')">Não compareceu</button><button class="btn btn-danger" onclick="setBooking(\''+b.id+'\',\'cancelled_seller\')">Cancelar</button>':'')+'<a class="btn ghost" href="negociacao.html?listing='+encodeURIComponent(b.listing_id)+'&buyer='+encodeURIComponent(b.buyer_id)+'">Conversar</a></div></div>').join('')||'<div class="muted">Nenhuma reserva recebida.</div>'}
async function setBooking(id,status){const{error}=await marketplaceDb.from('marketplace_bookings').update({status}).eq('id',id).eq('seller_id',user.id);if(error)return alert(error.message);await Promise.all([loadBookings(),loadSlots()])}
</script></body></html>
