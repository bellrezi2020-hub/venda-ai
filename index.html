<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VendaAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
    }

    .logo span {
      color: #6c63ff;
    }

    .container {
      max-width: 1150px;
      margin: auto;
      padding: 60px 25px;
    }

    .titulo {
      text-align: center;
      margin-bottom: 40px;
    }

    .titulo h1 {
      font-size: 46px;
      margin-bottom: 15px;
    }

    .titulo h1 span {
      color: #6c63ff;
    }

    .titulo p {
      color: #aaa;
      font-size: 18px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .numero-card {
      background: #161b22;
      border: 1px solid #2b3139;
      border-radius: 15px;
      padding: 20px;
    }

    .numero-card p {
      color: #999;
      margin-bottom: 10px;
    }

    .numero-card strong {
      font-size: 28px;
    }

    .box {
      background: #161b22;
      padding: 28px;
      border-radius: 18px;
      border: 1px solid #2b3139;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      background: #0d1117;
      color: white;
      border: 1px solid #30363d;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      padding: 14px 20px;
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .botao-principal {
      width: 100%;
    }

    #resultado {
      display: none;
      margin-top: 25px;
    }

    .card {
      background: #0d1117;
      border: 1px solid #2b3139;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .card strong {
      display: block;
      margin-bottom: 8px;
    }

    .quente {
      color: #ff6b6b;
      font-weight: bold;
    }

    .morno {
      color: #f0b95a;
      font-weight: bold;
    }

    .frio {
      color: #62a8ff;
      font-weight: bold;
    }

    .historico-topo {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .historico-topo select {
      width: auto;
      margin: 0;
    }

    .limpar {
      background: #2b3139;
    }

    .lead {
      background: #0d1117;
      border: 1px solid #2b3139;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 14px;
    }

    .lead-topo {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 13px;
    }

    .lead p {
      color: #bbb;
      margin-top: 8px;
      line-height: 1.5;
    }

    .data {
      color: #777;
      font-size: 13px;
    }

    .vazio {
      color: #777;
      text-align: center;
      padding: 30px;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    @media(max-width: 800px) {

      .dashboard {
        grid-template-columns: repeat(2, 1fr);
      }

      .titulo h1 {
        font-size: 35px;
      }
    }

  </style>
</head>

<body>

<header>

  <div class="logo">
    Venda<span>AI</span>
  </div>

  <div>
    Inteligência artificial para vendas
  </div>

</header>


<div class="container">

  <div class="titulo">

    <h1>
      Transforme leads em
      <span>clientes</span>
    </h1>

    <p>
      Analise mensagens, descubra a intenção do cliente
      e saiba qual deve ser o próximo passo.
    </p>

  </div>


  <div class="dashboard">

    <div class="numero-card">
      <p>Total de leads</p>
      <strong id="total">0</strong>
    </div>

    <div class="numero-card">
      <p>🔥 Quentes</p>
      <strong id="quentes">0</strong>
    </div>

    <div class="numero-card">
      <p>🟡 Mornos</p>
      <strong id="mornos">0</strong>
    </div>

    <div class="numero-card">
      <p>❄️ Frios</p>
      <strong id="frios">0</strong>
    </div>

  </div>


  <div class="box">

    <label>
      Tipo de negócio
    </label>

    <select id="negocio">
      <option>Imobiliária</option>
      <option>Loja de roupas</option>
      <option>Clínica de estética</option>
      <option>Academia</option>
      <option>Outro negócio</option>
    </select>


    <label>
      Nome do cliente
    </label>

    <input
      id="nome"
      type="text"
      placeholder="Ex: João"
    >


    <label>
      Mensagem do cliente
    </label>

    <textarea
      id="mensagem"
      placeholder="Ex: Procuro uma casa de até R$ 500 mil..."
    ></textarea>


    <button
      id="botao"
      class="botao-principal"
      onclick="analisarLead()"
    >
      🤖 Analisar cliente
    </button>


    <div id="resultado"></div>

  </div>


  <div class="box">

    <div class="historico-topo">

      <h2>
        📋 Histórico de leads
      </h2>

      <div>

        <select
          id="filtro"
          onchange="mostrarHistorico()"
        >

          <option value="Todos">
            Todos
          </option>

          <option value="Quente">
            🔥 Quentes
          </option>

          <option value="Morno">
            🟡 Mornos
          </option>

          <option value="Frio">
            ❄️ Frios
          </option>

        </select>

        <button
          class="limpar"
          onclick="limparHistorico()"
        >
          Limpar
        </button>

      </div>

    </div>


    <div id="historico"></div>

  </div>

</div>


<footer>
  VendaAI • IA para vendas
</footer>


<script>

let leads =
  JSON.parse(localStorage.getItem("vendaAILeads")) || [];


async function analisarLead() {

  const nome =
    document.getElementById("nome").value.trim()
    || "Cliente";

  const mensagem =
    document.getElementById("mensagem").value.trim();

  const negocio =
    document.getElementById("negocio").value;

  const resultado =
    document.getElementById("resultado");

  const botao =
    document.getElementById("botao");


  if (!mensagem) {

    alert("Digite a mensagem do cliente.");

    return;
  }


  resultado.style.display = "block";

  resultado.innerHTML = `
    <div class="card">
      🤖 Analisando cliente...
    </div>
  `;


  botao.disabled = true;

  botao.textContent =
    "Analisando...";


  try {

    const resposta =
      await fetch("/api/analisar", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          nome,
          mensagem,
          negocio
        })

      });


    const dados =
      await resposta.json();


    if (!resposta.ok) {

      throw new Error(
        dados.erro ||
        "Não foi possível analisar."
      );

    }


    const classeStatus =
      dados.status
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");


    resultado.innerHTML = `

      <div class="card">

        <strong>
          🔥 Temperatura do lead
        </strong>

        <span class="${classeStatus}">
          ${escaparHTML(dados.status)}
        </span>

      </div>


      <div class="card">

        <strong>
          🎯 Intenção
        </strong>

        ${escaparHTML(dados.intencao)}

      </div>


      <div class="card">

        <strong>
          💬 Resposta sugerida
        </strong>

        ${escaparHTML(dados.resposta)}

      </div>


      <div class="card">

        <strong>
          ➡️ Próximo passo
        </strong>

        ${escaparHTML(dados.proximoPasso)}

      </div>

    `;


    salvarLead({

      id: Date.now(),

      nome,

      negocio,

      mensagem,

      status: dados.status,

      intencao: dados.intencao,

      resposta: dados.resposta,

      proximoPasso: dados.proximoPasso,

      data:
        new Date().toLocaleString("pt-BR")

    });


  } catch (erro) {

    resultado.innerHTML = `

      <div class="card">

        ❌ Erro:
        ${escaparHTML(erro.message)}

      </div>

    `;

  }


  botao.disabled = false;

  botao.textContent =
    "🤖 Analisar cliente";

}



function salvarLead(lead) {

  leads.unshift(lead);

  localStorage.setItem(
    "vendaAILeads",
    JSON.stringify(leads)
  );

  atualizarDashboard();

  mostrarHistorico();

}



function mostrarHistorico() {

  const area =
    document.getElementById("historico");

  const filtro =
    document.getElementById("filtro").value;


  let lista = leads;


  if (filtro !== "Todos") {

    lista =
      leads.filter(
        lead =>
          lead.status
            .toLowerCase()
            .includes(filtro.toLowerCase())
      );

  }


  if (lista.length === 0) {

    area.innerHTML = `

      <div class="vazio">

        Nenhum lead salvo ainda.

      </div>

    `;

    return;
  }


  area.innerHTML =
    lista.map(lead => {

      const classe =
        lead.status
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");


      return `

        <div class="lead">

          <div class="lead-topo">

            <div>

              <strong>
                ${escaparHTML(lead.nome)}
              </strong>

              <div class="${classe}">
                ${escaparHTML(lead.status)}
              </div>

            </div>

            <div class="data">
              ${escaparHTML(lead.data)}
            </div>

          </div>


          <p>
            <strong>Negócio:</strong>
            ${escaparHTML(lead.negocio)}
          </p>


          <p>
            <strong>Mensagem:</strong>
            ${escaparHTML(lead.mensagem)}
          </p>


          <p>
            <strong>🎯 Intenção:</strong>
            ${escaparHTML(lead.intencao)}
          </p>


          <p>
            <strong>➡️ Próximo passo:</strong>
            ${escaparHTML(lead.proximoPasso)}
          </p>

        </div>

      `;

    }).join("");

}



function atualizarDashboard() {

  document.getElementById("total")
    .textContent =
    leads.length;


  document.getElementById("quentes")
    .textContent =
    leads.filter(
      l =>
        l.status.toLowerCase()
          .includes("quente")
    ).length;


  document.getElementById("mornos")
    .textContent =
    leads.filter(
      l =>
        l.status.toLowerCase()
          .includes("morno")
    ).length;


  document.getElementById("frios")
    .textContent =
    leads.filter(
      l =>
        l.status.toLowerCase()
          .includes("frio")
    ).length;

}



function limparHistorico() {

  if (
    !confirm(
      "Tem certeza que deseja apagar todo o histórico?"
    )
  ) {
    return;
  }


  leads = [];

  localStorage.removeItem(
    "vendaAILeads"
  );

  atualizarDashboard();

  mostrarHistorico();

}



function escaparHTML(texto) {

  const div =
    document.createElement("div");

  div.textContent =
    texto || "";

  return div.innerHTML;

}


atualizarDashboard();

mostrarHistorico();

</script>

</body>
</html>
