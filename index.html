<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendaAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 25px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    .logo span {
      color: #6c63ff;
    }

    .hero {
      max-width: 900px;
      margin: auto;
      padding: 90px 25px 50px;
      text-align: center;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 20px;
    }

    h1 span {
      color: #6c63ff;
    }

    .hero > p {
      font-size: 20px;
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .box {
      max-width: 650px;
      margin: auto;
      background: #161b22;
      padding: 30px;
      border-radius: 18px;
      text-align: left;
      border: 1px solid #2b3139;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      background: #0d1117;
      color: white;
      border: 1px solid #30363d;
      border-radius: 10px;
      font-size: 16px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #resultado {
      display: none;
      margin-top: 25px;
    }

    .card {
      background: #0d1117;
      border: 1px solid #2b3139;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      line-height: 1.6;
    }

    .card strong {
      display: block;
      margin-bottom: 8px;
      color: #fff;
    }

    .status {
      font-size: 20px;
      font-weight: bold;
      color: #6c63ff;
    }

    .loading {
      background: #0d1117;
      border: 1px solid #2b3139;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      color: #bbb;
    }

    .erro {
      background: #0d1117;
      border: 1px solid #5a2a2a;
      border-radius: 14px;
      padding: 20px;
      color: #ff9b9b;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }

      h1 {
        font-size: 36px;
      }

      .hero {
        padding-top: 60px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Venda<span>AI</span></div>
  <div>Seu vendedor com inteligência artificial</div>
</header>

<section class="hero">

  <h1>
    Transforme visitantes em
    <span>clientes</span>
  </h1>

  <p>
    Uma inteligência artificial que entende mensagens,
    identifica oportunidades de venda e sugere o próximo passo.
  </p>

  <div class="box">

    <label for="negocio">Tipo de negócio</label>

    <select id="negocio">
      <option>Imobiliária</option>
      <option>Loja de roupas</option>
      <option>Clínica de estética</option>
      <option>Academia</option>
      <option>Outro negócio</option>
    </select>

    <label for="nome">Nome do cliente</label>

    <input
      id="nome"
      type="text"
      placeholder="Ex: João"
    >

    <label for="mensagem">Mensagem do cliente</label>

    <textarea
      id="mensagem"
      placeholder="Ex: Procuro uma casa de até R$ 500 mil, com 3 quartos e garagem..."
    ></textarea>

    <button id="botao" onclick="analisarLead()">
      🤖 Analisar cliente
    </button>

    <div id="resultado"></div>

  </div>

</section>

<footer>
  VendaAI • IA para vendas
</footer>

<script>
async function analisarLead() {
  const nome = document.getElementById("nome").value.trim() || "Cliente";
  const mensagem = document.getElementById("mensagem").value.trim();
  const negocio = document.getElementById("negocio").value;

  const resultado = document.getElementById("resultado");
  const botao = document.getElementById("botao");

  if (!mensagem) {
    alert("Digite a mensagem do cliente.");
    return;
  }

  resultado.style.display = "block";

  resultado.innerHTML = `
    <div class="loading">
      🤖 Analisando cliente...
    </div>
  `;

  botao.disabled = true;
  botao.textContent = "Analisando...";

  try {
    const resposta = await fetch("/api/analisar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        nome,
        mensagem,
        negocio
      })
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      throw new Error(
        dados.erro || "Não foi possível analisar o cliente."
      );
    }

    resultado.innerHTML = `
      <div class="card">
        <strong>🔥 Temperatura do lead</strong>
        <div class="status">
          ${escaparHTML(dados.status)}
        </div>
      </div>

      <div class="card">
        <strong>🎯 Intenção do cliente</strong>
        ${escaparHTML(dados.intencao)}
      </div>

      <div class="card">
        <strong>💬 Resposta sugerida</strong>
        ${escaparHTML(dados.resposta)}
      </div>

      <div class="card">
        <strong>➡️ Próximo passo</strong>
        ${escaparHTML(dados.proximoPasso)}
      </div>
    `;

  } catch (erro) {
    resultado.innerHTML = `
      <div class="erro">
        ❌ Não foi possível analisar agora.
        <br><br>
        ${escaparHTML(erro.message)}
      </div>
    `;
  }

  botao.disabled = false;
  botao.textContent = "🤖 Analisar cliente";
}

function escaparHTML(texto) {
  const div = document.createElement("div");
  div.textContent = texto || "";
  return div.innerHTML;
}
</script>

</body>
</html>
