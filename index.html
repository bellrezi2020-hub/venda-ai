<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VendaAI - Dashboard</title><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
</head><body><div id="nav"></div>
<div class="container"><h1>Dashboard</h1><p class="sub">Visão geral da sua operação comercial.</p>
<div class="grid-4">
<div class="card metric"><p>Total de leads</p><strong id="total">0</strong></div>
<div class="card metric"><p>🔥 Leads quentes</p><strong id="quentes">0</strong></div>
<div class="card metric"><p>🏠 Imóveis cadastrados</p><strong id="imoveis">0</strong></div>
<div class="card metric"><p>🎯 Leads com match</p><strong id="matches">0</strong></div>
</div>
<div class="grid-3" style="margin-top:20px">
<a class="card" href="empresa.html" style="text-decoration:none"><h3>⚙️ Empresa</h3><p class="muted" style="margin-top:8px">Dados da imobiliária e configurações.</p></a>
<a class="card" href="imoveis.html" style="text-decoration:none"><h3>🏠 Imóveis</h3><p class="muted" style="margin-top:8px">Cadastre e organize seu catálogo.</p></a>
<a class="card" href="leads.html" style="text-decoration:none"><h3>🤖 Leads</h3><p class="muted" style="margin-top:8px">Analise, qualifique e acompanhe clientes.</p></a>
</div></div>
<script>
document.getElementById("nav").innerHTML=nav("dashboard");
(async()=>{
 const user=await requireAuth(); if(!user)return;
 const c=await currentCompany(); if(!c)return;
 const [{count:lc},{count:qc},{count:ic},{count:mc}]=await Promise.all([
   supabaseClient.from("leads").select("*",{count:"exact",head:true}).eq("company_id",c.id),
   supabaseClient.from("leads").select("*",{count:"exact",head:true}).eq("company_id",c.id).eq("temperature","Quente"),
   supabaseClient.from("properties").select("*",{count:"exact",head:true}).eq("company_id",c.id),
   supabaseClient.from("leads").select("*",{count:"exact",head:true}).eq("company_id",c.id).gt("match_count",0)
 ]);
 total.textContent=lc||0;quentes.textContent=qc||0;imoveis.textContent=ic||0;matches.textContent=mc||0;
})();
</script></body></html>
