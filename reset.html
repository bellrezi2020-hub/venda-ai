<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VendaAI - Nova senha</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><div class="container" style="max-width:560px;padding-top:75px"><div class="box"><h1 style="font-size:30px">Nova senha</h1><label>Nova senha</label><input id="senha" type="password"><button class="btn-full" onclick="salvar()">Salvar nova senha</button><p id="msg" class="muted small" style="margin-top:12px"></p></div></div><script>async function salvar(){const {error}=await supabaseClient.auth.updateUser({password:senha.value});msg.textContent=error?error.message:'Senha alterada.'}</script></body></html>
