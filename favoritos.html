<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favoritos — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261014-0010"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="minhas-negociacoes.html">Negociações</a><a href="notificacoes.html">Notificações</a></nav></header><main class="wrap section"><div class="section-head"><div><h1>Meus favoritos</h1><div class="muted">Anúncios que você salvou.</div></div></div><div id="status" class="notice">Carregando...</div><div id="cards" class="grid g4 section"></div></main><script>
let user=null;
(async()=>{try{user=await MP.requireUser('favoritos.html');if(!user)return;const{data,error}=await marketplaceDb.from('marketplace_favorites').select('listing_id,marketplace_listings(id,title,price,city,state,category,status,marketplace_listing_media(url),marketplace_stores(name,verified))').eq('user_id',user.id).order('created_at',{ascending:false});if(error)throw error;const items=(data||[]).map(x=>x.marketplace_listings).filter(x=>x&&x.status==='active');document.getElementById('cards').innerHTML=items.map(x=>{const img=x.marketplace_listing_media?.[0]?.url;return '<article class="card product-card"><div class="product-img">'+(img?'<img src="'+MP.esc(img)+'" style="width:100%;height:100%;object-fit:cover">':MP.categoryEmoji(x.category))+'</div><div class="product-body"><h3>'+MP.esc(x.title)+'</h3><div class="price">'+MP.money(x.price)+'</div><p class="muted">'+MP.esc([x.city,x.state].filter(Boolean).join(' - '))+'</p><a class="btn ghost" style="width:100%;margin-top:12px" href="anuncio.html?id='+encodeURIComponent(x.id)+'">Ver anúncio</a></div></article>'}).join('')||'<div class="notice">Você ainda não favoritou nenhum anúncio.</div>';const s=document.getElementById('status');s.className='notice ok';s.textContent='✓ Favoritos carregados.'}catch(e){const s=document.getElementById('status');s.className='notice warn';s.textContent=e.message||String(e)}})();
</script></body></html>
