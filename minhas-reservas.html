<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhas reservas — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261014-0630"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="minhas-negociacoes.html">Negociações</a><a href="notificacoes.html">Notificações</a><a href="perfil.html">Meu perfil</a></nav></header><main class="wrap section"><div class="section-head"><div><h1>Minhas reservas</h1><div class="muted">Seus agendamentos de serviços dentro da VendaAI.</div></div></div><div id="status" class="notice">Carregando...</div><section class="section"><div id="items"></div></section></main><script>
let user=null;const fmt=v=>new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const labels={pending:'Aguardando confirmação',confirmed:'Confirmada',completed:'Concluída',cancelled_buyer:'Cancelada por você',cancelled_seller:'Cancelada pelo prestador',no_show:'Não compareceu'};
(async()=>{try{user=await MP.requireUser('minhas-reservas.html');if(!user)return;await load();const s=document.getElementById('status');s.className='notice ok';s.textContent='✓ Reservas carregadas.'}catch(e){const s=document.getElementById('status');s.className='notice warn';s.textContent=e.message||String(e)}})();
async function load(){const{data,error}=await marketplaceDb.from('marketplace_bookings').select('*,marketplace_listings(id,title,price,store_id,marketplace_stores(*))').eq('buyer_id',user.id).order('starts_at',{ascending:false});if(error)throw error;items.innerHTML=(data||[]).map(b=>'<div class="card" style="margin-bottom:12px"><div class="row"><div><strong>'+MP.esc(b.marketplace_listings?.title||'Serviço')+'</strong><div class="muted">'+fmt(b.starts_at)+' • '+MP.esc(b.marketplace_listings?.marketplace_stores?.public_name||b.marketplace_listings?.marketplace_stores?.name||'Prestador')+'</div><span class="status '+(b.status==='confirmed'||b.status==='completed'?'green':b.status.startsWith('cancelled')?'red':'yellow')+'">'+MP.esc(labels[b.status]||b.status)+'</span>'+(b.buyer_note?'<div class="muted small" style="margin-top:8px">Sua observação: '+MP.esc(b.buyer_note)+'</div>':'')+'</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+(['pending','confirmed'].includes(b.status)?'<button class="btn btn-danger" onclick="cancelBooking(\''+b.id+'\')">Cancelar</button>':'')+'<a class="btn ghost" href="negociacao.html?listing='+encodeURIComponent(b.listing_id)+'">Conversar</a></div></div></div>').join('')||'<div class="notice">Você ainda não possui reservas.</div>'}
async function cancelBooking(id){if(!confirm('Cancelar esta reserva?'))return;const{error}=await marketplaceDb.from('marketplace_bookings').update({status:'cancelled_buyer'}).eq('id',id).eq('buyer_id',user.id);if(error)return alert(error.message);load()}
</script></body></html>
