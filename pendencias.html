<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>VendaAI - Pendências</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</head>

<body>

  <div id="nav"></div>

  <div class="container">

    <h1>Pendências</h1>

    <p class="sub">
      O que precisa de atenção agora.
    </p>

    <div id="lista"></div>

  </div>


  <script>

    let ctx = null;


    (async () => {

      ctx =
        await renderNav(
          "pendencias"
        );


      if (
        !ctx?.company
      ) {

        return;

      }


      const {
        data,
        error
      } =
        await supabaseClient
          .from(
            "leads"
          )
          .select("*")
          .eq(
            "company_id",
            ctx.company.id
          )
          .in(
            "status",
            [
              "Novo",
              "Em contato",
              "Aguardando confirmação de visita"
            ]
          )
          .order(
            "last_activity_at",
            {
              ascending:
                true
            }
          );


      if (
        error
      ) {

        document
          .getElementById(
            "lista"
          )
          .innerHTML = `

<p class="danger">

${esc(
  error.message
)}

</p>

`;

        return;

      }


      document
        .getElementById(
          "lista"
        )
        .innerHTML =
        (data || [])
          .map(
            lead => `

<div class="box">

<div class="row">

<div>

<h3>

${esc(
  lead.name
)}

</h3>


<div class="${normalizar(
  lead.temperature
)}">

${esc(
  lead.temperature
)}

</div>

</div>


<span class="badge">

${esc(
  lead.status
)}

</span>

</div>


<p
class="muted"
style="margin-top:8px"
>

${esc(
  lead.next_step || ""
)}

</p>


<div
class="row"
style="margin-top:12px"
>

<a
class="btn btn-secondary"
href="lead.html?id=${lead.id}"
>

Abrir lead

</a>


<button
onclick="
follow(
'${lead.id}'
)
"
>

Gerar follow-up

</button>

</div>


<div id="f_${lead.id}"></div>

</div>

`
          )
          .join("") ||

        '<p class="muted">Nada pendente.</p>';

    })();



    async function follow(
      id
    ) {

      const {
        data: lead,
        error
      } =
        await supabaseClient
          .from(
            "leads"
          )
          .select("*")
          .eq(
            "id",
            id
          )
          .single();


      if (
        error
      ) {

        alert(
          error.message
        );

        return;

      }


      const resposta =
        await fetch(
          "/api/followup",
          {

            method:
              "POST",

            headers:
              await authHeaders(),

            body:
              JSON.stringify({

                lead,

                empresa:
                  ctx.company

              })

          }
        );


      const dados =
        await resposta.json();


      document
        .getElementById(
          "f_" + id
        )
        .innerHTML = `

<div class="list-item">

${esc(
  dados.resposta ||
  dados.erro ||
  "Não foi possível gerar o follow-up."
)}

</div>

`;

    }

  </script>

</body>

</html>
