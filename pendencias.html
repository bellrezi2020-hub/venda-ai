<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VendaAI - Pendências</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><div id="nav"></div><div class="container"><h1>Pendências</h1><p class="sub">O que precisa de atenção agora.</p><div id="lista"></div></div><script>document.getElementById('nav').innerHTML=nav('pendencias');(async()=>{await requireAuth();const c=await currentCompany();const {data}=await supabaseClient.from('leads').select('*').eq('company_id',c.id).in('status',['Novo','Em contato','Aguardando confirmação de visita']).order('last_activity_at',{ascending:true});lista.innerHTML=(data||[]).map(l=>`<div class="box"><div class="row"><div><h3>${esc(l.name)}</h3><div class="${normalizar(l.temperature)}">${esc(l.temperature)}</div></div><span class="badge">${esc(l.status)}</span></div><p class="muted" style="margin-top:8px">${esc(l.next_step||'')}</p><div class="row" style="margin-top:12px"><a class="btn btn-secondary" href="lead.html?id=${l.id}">Abrir lead</a><button onclick="follow('${l.id}')">Gerar follow-up</button></div><div id="f_${l.id}"></div></div>`).join('')||'<p class="muted">Nada pendente.</p>'})();async function follow(id){const {data:lead}=await supabaseClient.from('leads').select('*').eq('id',id).single();const c=await currentCompany();const r=await fetch('/api/followup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lead,empresa:c})});const d=await r.json();document.getElementById('f_'+id).innerHTML=`<div class="list-item">${esc(d.resposta||d.erro)}</div>`}</script></body></html>
