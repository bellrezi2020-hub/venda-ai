<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explorar — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="marketplace.js"></script></head><body><header class="mp-header"><a class="mp-logo" href="landing.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="vender.html">Vender</a><a href="seguranca.html">Segurança</a><a href="login.html">Entrar</a></nav></header><main class="wrap section"><div class="section-head"><div><h1>Explorar</h1><div class="muted">Produtos, serviços, veículos e imóveis.</div></div><a class="btn" href="vender.html">+ Anunciar</a></div><div class="searchbar" style="margin:0;max-width:none"><input id="q" placeholder="O que você procura?"><button class="btn" onclick="apply()">Buscar</button></div><div class="filters"><button class="chip active" data-cat="">Tudo</button><button class="chip" data-cat="Imóveis">🏠 Imóveis</button><button class="chip" data-cat="Veículos">🚗 Veículos</button><button class="chip" data-cat="Produtos">🛍️ Produtos</button><button class="chip" data-cat="Serviços">🔧 Serviços</button></div><div class="toolbar"><span class="muted" id="count"></span><select id="sort" class="input" style="max-width:230px" onchange="apply()"><option value="relevancia">Mais relevantes</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option></select></div><div class="grid g4" id="cards"></div></main><script>let cat='';const p=new URLSearchParams(location.search);document.querySelector('#q').value=p.get('q')||'';cat=p.get('cat')||'';document.querySelectorAll('.chip').forEach(b=>{if(b.dataset.cat===cat){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active')}b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');apply()}});function apply(){const q=document.querySelector('#q').value.toLowerCase();let a=VendaAIMarketplace.sampleListings.filter(x=>(!cat||x.cat===cat)&&(!q||(x.title+' '+x.city+' '+x.store+' '+x.cat).toLowerCase().includes(q)));const s=document.querySelector('#sort').value;if(s==='menor')a.sort((x,y)=>x.price-y.price);if(s==='maior')a.sort((x,y)=>y.price-x.price);document.querySelector('#count').textContent=a.length+' resultado(s)';VendaAIMarketplace.renderCards('#cards',a)}apply();</script></body></html>
