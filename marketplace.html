<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explorar — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261013-1800"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="vender.html">Vender</a><a href="seguranca.html">Segurança</a><a href="login.html?next=vendedor-painel.html">Entrar</a></nav></header><main class="wrap section"><div class="section-head"><div><h1>Explorar</h1><div class="muted">Anúncios reais aprovados na VendaAI.</div></div><a class="btn" href="vender.html">+ Anunciar</a></div><div class="searchbar" style="margin:0;max-width:none"><input id="q" placeholder="O que você procura?"><button class="btn" onclick="apply()">Buscar</button></div><div class="filters"><button class="chip active" data-cat="">Tudo</button><button class="chip" data-cat="real_estate">🏠 Imóveis</button><button class="chip" data-cat="vehicles">🚗 Veículos</button><button class="chip" data-cat="products">🛍️ Produtos</button><button class="chip" data-cat="services">🔧 Serviços</button></div><div class="toolbar"><span class="muted" id="count">Carregando...</span><select id="sort" class="input" style="max-width:230px" onchange="apply()"><option value="relevancia">Mais recentes</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option></select></div><div class="grid g4" id="cards"></div></main><script>let all=[],cat='';const p=new URLSearchParams(location.search);q.value=p.get('q')||'';cat=p.get('cat')||'';document.querySelectorAll('.chip').forEach(b=>{if(b.dataset.cat===cat){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active')}b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');apply()}});async function load(){const{data,error}=await marketplaceDb.from('marketplace_listings').select('id,title,price,city,state,category,store_id,marketplace_stores(name,verified,rating)').eq('status','active').order('created_at',{ascending:false});if(error){count.textContent='Marketplace ainda não conectado ao banco.';cards.innerHTML='<div class="notice warn">Rode a migração V10 no Supabase para ativar os anúncios reais.</div>';return}all=data||[];apply()}function apply(){const s=q.value.trim().toLowerCase();let a=all.filter(x=>(!cat||x.category===cat)&&(!s||(x.title+' '+(x.city||'')+' '+(x.marketplace_stores?.name||'')).toLowerCase().includes(s)));if(sort.value==='menor')a.sort((x,y)=>Number(x.price)-Number(y.price));if(sort.value==='maior')a.sort((x,y)=>Number(y.price)-Number(x.price));count.textContent=a.length+' resultado(s)';cards.innerHTML=a.map(x=>'<article class="card product-card"><div class="product-img">'+MP.categoryEmoji(x.category)+'</div><div class="product-body">'+(x.marketplace_stores?.verified?'<div class="tag ok">✓ Loja verificada</div>':'<div class="tag">Novo vendedor</div>')+'<h3>'+MP.esc(x.title)+'</h3><div class="price">'+MP.money(x.price)+'</div><p class="muted">'+MP.esc([x.city,x.state].filter(Boolean).join(' - '))+'</p><div class="store"><div class="avatar">'+MP.esc((x.marketplace_stores?.name||'V').slice(0,1))+'</div><div><strong>'+MP.esc(x.marketplace_stores?.name||'Vendedor')+'</strong></div></div><a class="btn ghost" style="margin-top:14px;width:100%" href="anuncio.html?id='+encodeURIComponent(x.id)+'">Ver anúncio</a></div></article>').join('')||'<div class="notice">Ainda não há anúncios aprovados nessa busca. <a href="vender.html">Seja um dos primeiros vendedores.</a></div>'}load();</script></body></html>
