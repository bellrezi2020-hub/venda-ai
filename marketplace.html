<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explorar — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261014-0100"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="favoritos.html">Favoritos</a><a href="notificacoes.html">Notificações</a><a href="perfil.html">Meu perfil</a><a href="vender.html">Vender</a></nav></header><main class="wrap section"><div class="section-head"><div><h1>Explorar</h1><div class="muted">Encontre anúncios reais aprovados.</div></div><a class="btn" href="vender.html">+ Anunciar</a></div><div class="searchbar" style="margin:0;max-width:none"><input id="q" placeholder="O que você procura?"><button class="btn" onclick="apply()">Buscar</button></div><div class="filters"><button class="chip active" data-cat="">Tudo</button><button class="chip" data-cat="real_estate">🏠 Imóveis</button><button class="chip" data-cat="vehicles">🚗 Veículos</button><button class="chip" data-cat="products">🛍️ Produtos</button><button class="chip" data-cat="services">🔧 Serviços</button></div><div class="card" style="margin:14px 0"><div class="form-grid"><div class="field"><label>Cidade</label><input id="cityFilter" class="input" placeholder="Ex.: Sarandi"></div><div class="field"><label>Estado</label><input id="stateFilter" class="input" maxlength="2" placeholder="RS"></div><div class="field"><label>Preço mínimo</label><input id="minPrice" class="input" type="number" min="0"></div><div class="field"><label>Preço máximo</label><input id="maxPrice" class="input" type="number" min="0"></div></div><div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="apply()">Aplicar filtros</button><button class="btn secondary" onclick="clearFilters()">Limpar</button></div></div><div class="toolbar"><span class="muted" id="count">Carregando...</span><select id="sort" class="input" style="max-width:230px" onchange="apply()"><option value="relevancia">Mais recentes</option><option value="menor">Menor preço</option><option value="maior">Maior preço</option></select></div><div class="grid g4" id="cards"></div></main><script>
let all=[],cat='';const params=new URLSearchParams(location.search);q.value=params.get('q')||'';cat=params.get('cat')||'';cityFilter.value=params.get('city')||'';stateFilter.value=params.get('state')||'';minPrice.value=params.get('min')||'';maxPrice.value=params.get('max')||'';
document.querySelectorAll('.chip').forEach(b=>{if(b.dataset.cat===cat){document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active')}b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');apply()}});
async function load(){const{data,error}=await marketplaceDb.from('marketplace_listings').select('id,title,price,city,state,category,store_id,marketplace_stores(name,verified,rating),marketplace_listing_media(url)').eq('status','active').order('created_at',{ascending:false});if(error){count.textContent='Erro ao carregar.';cards.innerHTML='<div class="notice warn">'+MP.esc(error.message)+'</div>';return}all=data||[];apply()}
function apply(){const s=q.value.trim().toLowerCase(),city=cityFilter.value.trim().toLowerCase(),st=stateFilter.value.trim().toLowerCase(),min=Number(minPrice.value||0),max=Number(maxPrice.value||0);let a=all.filter(x=>(!cat||x.category===cat)&&(!s||(x.title+' '+(x.city||'')+' '+(x.marketplace_stores?.name||'')).toLowerCase().includes(s))&&(!city||(x.city||'').toLowerCase().includes(city))&&(!st||(x.state||'').toLowerCase()===st)&&(!min||Number(x.price)>=min)&&(!max||Number(x.price)<=max));if(sort.value==='menor')a.sort((x,y)=>Number(x.price)-Number(y.price));if(sort.value==='maior')a.sort((x,y)=>Number(y.price)-Number(x.price));count.textContent=a.length+' resultado(s)';cards.innerHTML=a.map(x=>{const img=x.marketplace_listing_media?.[0]?.url;return '<article class="card product-card"><div class="product-img">'+(img?'<img src="'+MP.esc(img)+'" style="width:100%;height:100%;object-fit:cover">':MP.categoryEmoji(x.category))+'</div><div class="product-body">'+(x.marketplace_stores?.verified?'<div class="tag ok">✓ Loja verificada</div>':'<div class="tag">Novo vendedor</div>')+'<h3>'+MP.esc(x.title)+'</h3><div class="price">'+MP.money(x.price)+'</div><p class="muted">'+MP.esc([x.city,x.state].filter(Boolean).join(' - '))+'</p><div class="store"><div class="avatar">'+MP.esc((x.marketplace_stores?.name||'V').slice(0,1))+'</div><div><strong>'+MP.esc(x.marketplace_stores?.name||'Vendedor')+'</strong><div class="muted">⭐ '+Number(x.marketplace_stores?.rating||0).toFixed(1)+'</div></div></div><a class="btn ghost" style="margin-top:14px;width:100%" href="anuncio.html?id='+encodeURIComponent(x.id)+'">Ver anúncio</a></div></article>'}).join('')||'<div class="notice">Nenhum anúncio encontrado com esses filtros.</div>'}
function clearFilters(){q.value='';cityFilter.value='';stateFilter.value='';minPrice.value='';maxPrice.value='';cat='';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.cat===''));apply()}
load();
</script></body></html>
