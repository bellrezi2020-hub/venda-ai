<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VendaAI - Empresa</title><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
</head><body><div id="nav"></div>
<div class="container"><h1>Empresa</h1><p class="sub">Informações que a IA usa nas respostas.</p>
<div class="box">
<label>Nome da imobiliária</label><input id="nome">
<label>Região atendida</label><input id="regiao">
<label>Diferenciais</label><textarea id="diferenciais"></textarea>
<label>Observações</label><textarea id="observacoes"></textarea>
<button class="btn-full" onclick="salvar()">💾 Salvar informações</button>
<p id="msg" class="success small" style="margin-top:12px"></p>
</div></div>
<script>
document.getElementById("nav").innerHTML=nav("empresa");
let user;
(async()=>{
 user=await requireAuth(); if(!user)return;
 const c=await currentCompany();
 if(c){nome.value=c.name||"";regiao.value=c.region||"";diferenciais.value=c.differentials||"";observacoes.value=c.notes||""}
})();
async function salvar(){
 const payload={owner_id:user.id,name:nome.value.trim(),region:regiao.value.trim(),differentials:diferenciais.value.trim(),notes:observacoes.value.trim()};
 const existing=await currentCompany();
 let q=existing?supabaseClient.from("companies").update(payload).eq("id",existing.id):supabaseClient.from("companies").insert(payload);
 const {error}=await q;if(error){msg.textContent=error.message;return}msg.textContent="✅ Informações salvas.";
}
</script></body></html>
