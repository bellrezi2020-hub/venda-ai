<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar loja — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261014-0100"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="vendedor-painel.html">Meu painel</a><a href="marketplace.html">Explorar</a></nav></header><main class="wrap section"><div class="section-head"><div><h1>Configurar minha loja</h1><div class="muted">Edite como sua loja aparece para compradores.</div></div></div><div id="status" class="notice">Carregando...</div><section id="form" class="card section hidden"><div class="field"><label>Nome da loja</label><input id="name" class="input"></div><div class="field"><label>Descrição</label><textarea id="description" class="input" placeholder="Conte um pouco sobre sua loja"></textarea></div><div class="form-grid"><div class="field"><label>Cidade</label><input id="city" class="input"></div><div class="field"><label>Estado</label><input id="state" class="input" maxlength="2"></div></div><div class="trust"><span id="followers">0 seguidores</span><span id="rating">⭐ 0.0</span></div><button class="btn" style="margin-top:16px" onclick="saveStore()">Salvar alterações</button><a id="publicLink" class="btn ghost" style="margin-top:16px" href="#">Ver loja pública</a><p id="msg" class="muted"></p></section></main><script>
let user=null,store=null;
(async()=>{try{user=await MP.requireUser('configurar-loja.html');if(!user)return;store=await MP.storeFor(user.id);if(!store)throw new Error('Crie sua loja primeiro no painel do vendedor.');name.value=store.name||'';description.value=store.description||'';city.value=store.city||'';state.value=store.state||'RS';followers.textContent=Number(store.followers_count||0)+' seguidores';rating.textContent='⭐ '+Number(store.rating||0).toFixed(1);publicLink.href='loja.html?id='+encodeURIComponent(store.id);document.getElementById('form').classList.remove('hidden');const s=document.getElementById('status');s.className='notice ok';s.textContent='✓ Loja carregada.'}catch(e){const s=document.getElementById('status');s.className='notice warn';s.textContent=e.message||String(e)}})();
async function saveStore(){const payload={name:name.value.trim(),description:description.value.trim(),city:city.value.trim(),state:state.value.trim().toUpperCase(),updated_at:new Date().toISOString()};if(!payload.name)return msg.textContent='Informe o nome da loja.';const{data,error}=await marketplaceDb.from('marketplace_stores').update(payload).eq('id',store.id).eq('owner_id',user.id).select().single();if(error)return msg.textContent=error.message;store=data;msg.textContent='✓ Loja atualizada.'}
</script></body></html>
