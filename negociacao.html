<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Negociação — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261013-1825"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="minhas-negociacoes.html">Minhas negociações</a></nav></header><main class="wrap section"><div id="top" class="notice">Abrindo negociação...</div><div id="chatArea" class="hidden"><div class="card" style="margin-top:16px"><div id="messages" class="chat" style="min-height:300px"></div><div class="divider"></div><div style="display:flex;gap:8px"><input id="messageInput" class="input" style="margin:0" placeholder="Digite sua mensagem..."><button class="btn" onclick="sendMessage()">Enviar</button></div><p class="muted small" style="margin-top:8px">Para sua segurança, telefone, e-mail, Pix, @ e links externos são ocultados automaticamente.</p></div></div></main><script>
let user=null,listing=null,conversation=null;
(async()=>{try{user=await MP.requireUser(location.pathname.split('/').pop()+location.search);if(!user)return;const p=new URLSearchParams(location.search);const listingId=p.get('listing');const buyerParam=p.get('buyer');if(!listingId)throw new Error('Anúncio não informado.');const lr=await marketplaceDb.from('marketplace_listings').select('id,title,seller_id,status,price').eq('id',listingId).maybeSingle();if(lr.error||!lr.data)throw lr.error||new Error('Anúncio não encontrado.');listing=lr.data;let buyerId=user.id;if(user.id===listing.seller_id){if(!buyerParam)throw new Error('Comprador não informado para esta conversa.');buyerId=buyerParam}else if(buyerParam&&buyerParam!==user.id){throw new Error('Negociação inválida.')}const existing=await marketplaceDb.from('marketplace_conversations').select('*').eq('listing_id',listing.id).eq('buyer_id',buyerId).eq('seller_id',listing.seller_id).maybeSingle();if(existing.error)throw existing.error;conversation=existing.data;if(!conversation){const ins=await marketplaceDb.from('marketplace_conversations').insert({listing_id:listing.id,buyer_id:buyerId,seller_id:listing.seller_id}).select().single();if(ins.error)throw ins.error;conversation=ins.data}document.getElementById('top').className='notice ok';document.getElementById('top').innerHTML='<strong>'+MP.esc(listing.title)+'</strong><br>'+MP.money(listing.price)+' • conversa protegida pela VendaAI';document.getElementById('chatArea').classList.remove('hidden');await loadMessages();setInterval(loadMessages,5000)}catch(e){const t=document.getElementById('top');t.className='notice warn';t.innerHTML='<strong>Não consegui abrir a negociação.</strong><br>'+MP.esc(e?.message||String(e))}})();
async function loadMessages(){if(!conversation)return;const{data,error}=await marketplaceDb.from('marketplace_messages').select('*').eq('conversation_id',conversation.id).order('created_at',{ascending:true});if(error)return;const el=document.getElementById('messages');el.innerHTML=(data||[]).map(m=>'<div class="msg '+(m.sender_id===user.id?'user':'ai')+'">'+MP.esc(m.body)+(m.contact_redacted?'<div class="small muted" style="margin-top:5px">🔒 contato externo ocultado</div>':'')+'</div>').join('')||'<div class="muted">Nenhuma mensagem ainda. Comece a conversa.</div>';el.scrollTop=el.scrollHeight}
async function sendMessage(){const input=document.getElementById('messageInput');const body=input.value.trim();if(!body||!conversation)return;input.disabled=true;const{error}=await marketplaceDb.from('marketplace_messages').insert({conversation_id:conversation.id,sender_id:user.id,body});input.disabled=false;if(error)return alert(error.message);input.value='';await marketplaceDb.from('marketplace_conversations').update({updated_at:new Date().toISOString()}).eq('id',conversation.id);await loadMessages()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.id==='messageInput')sendMessage()});
</script></body></html>
