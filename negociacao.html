<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Negociação — VendaAI</title>

  <link rel="stylesheet" href="marketplace.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="marketplace-client.js?v=20261013-1845"></script>

  <style>
    .chat-wrap{
      margin-top:16px;
    }

    .chat-box{
      display:flex;
      flex-direction:column;
      gap:10px;
      height:420px;
      overflow-y:auto;
      padding:16px;
      background:#0b1017;
      border:1px solid #27303b;
      border-radius:16px;
    }

    .chat-row{
      display:flex;
      width:100%;
    }

    .chat-row.mine{
      justify-content:flex-end;
    }

    .chat-row.theirs{
      justify-content:flex-start;
    }

    .chat-bubble{
      max-width:72%;
      padding:12px 14px;
      border-radius:16px;
      line-height:1.45;
      word-break:break-word;
    }

    .chat-row.mine .chat-bubble{
      background:linear-gradient(135deg,#7c6cff,#5f4df0);
      color:#fff;
      border-bottom-right-radius:5px;
    }

    .chat-row.theirs .chat-bubble{
      background:#151c26;
      color:#fff;
      border:1px solid #27303b;
      border-bottom-left-radius:5px;
    }

    .chat-note{
      margin-top:6px;
      font-size:12px;
      opacity:.8;
    }

    .chat-input{
      display:flex;
      gap:8px;
      margin-top:12px;
    }

    .chat-input input{
      flex:1;
    }

    @media(max-width:650px){
      .chat-bubble{
        max-width:88%;
      }

      .chat-input{
        flex-direction:column;
      }
    }
  </style>
</head>

<body>

<header class="mp-header">
  <a class="mp-logo" href="index.html">
    Venda<span>AI</span>
  </a>

  <nav class="mp-nav">
    <a href="marketplace.html">Explorar</a>
    <a href="minhas-negociacoes.html">Minhas negociações</a>
  </nav>
</header>

<main class="wrap section">

  <div id="top" class="notice">
    Abrindo negociação...
  </div>

  <div id="chatArea" class="chat-wrap hidden">

    <div class="card">

      <div id="messages" class="chat-box"></div>

      <div class="chat-input">
        <input
          id="messageInput"
          class="input"
          placeholder="Digite sua mensagem..."
        >

        <button class="btn" onclick="sendMessage()">
          Enviar
        </button>
      </div>

      <p class="muted small" style="margin-top:8px">
        🔒 Para sua segurança, telefone, e-mail, Pix, @ e links externos
        são ocultados automaticamente.
      </p>

    </div>

  </div>

</main>

<script>

let user = null;
let listing = null;
let conversation = null;

(async()=>{

  try{

    user = await MP.requireUser(
      location.pathname.split('/').pop() + location.search
    );

    if(!user) return;

    const params = new URLSearchParams(location.search);

    const listingId = params.get('listing');
    const buyerParam = params.get('buyer');

    if(!listingId){
      throw new Error('Anúncio não informado.');
    }

    const listingResult = await marketplaceDb
      .from('marketplace_listings')
      .select('id,title,seller_id,status,price')
      .eq('id', listingId)
      .maybeSingle();

    if(listingResult.error || !listingResult.data){
      throw listingResult.error || new Error('Anúncio não encontrado.');
    }

    listing = listingResult.data;

    let buyerId = user.id;

    if(user.id === listing.seller_id){

      if(!buyerParam){
        throw new Error('Comprador não informado para esta conversa.');
      }

      buyerId = buyerParam;

    }else if(buyerParam && buyerParam !== user.id){

      throw new Error('Negociação inválida.');

    }

    const existing = await marketplaceDb
      .from('marketplace_conversations')
      .select('*')
      .eq('listing_id', listing.id)
      .eq('buyer_id', buyerId)
      .eq('seller_id', listing.seller_id)
      .maybeSingle();

    if(existing.error){
      throw existing.error;
    }

    conversation = existing.data;

    if(!conversation){

      const created = await marketplaceDb
        .from('marketplace_conversations')
        .insert({
          listing_id: listing.id,
          buyer_id: buyerId,
          seller_id: listing.seller_id
        })
        .select()
        .single();

      if(created.error){
        throw created.error;
      }

      conversation = created.data;
    }

    const top = document.getElementById('top');

    top.className = 'notice ok';

    top.innerHTML =
      '<strong>' + MP.esc(listing.title) + '</strong><br>' +
      MP.money(listing.price) +
      ' • conversa protegida pela VendaAI';

    document
      .getElementById('chatArea')
      .classList.remove('hidden');

    await loadMessages();

    setInterval(loadMessages, 4000);

  }catch(e){

    const top = document.getElementById('top');

    top.className = 'notice warn';

    top.innerHTML =
      '<strong>Não consegui abrir a negociação.</strong><br>' +
      MP.esc(e?.message || String(e));

  }

})();

async function loadMessages(){

  if(!conversation) return;

  const { data, error } = await marketplaceDb
    .from('marketplace_messages')
    .select('*')
    .eq('conversation_id', conversation.id)
    .order('created_at', { ascending:true });

  if(error) return;

  const el = document.getElementById('messages');

  el.innerHTML = (data || []).map(m => {

    const mine = m.sender_id === user.id;

    return `
      <div class="chat-row ${mine ? 'mine' : 'theirs'}">

        <div class="chat-bubble">

          <div>
            ${MP.esc(m.body)}
          </div>

          ${
            m.contact_redacted
            ? `
              <div class="chat-note">
                🔒 contato externo ocultado
              </div>
            `
            : ''
          }

        </div>

      </div>
    `;

  }).join('');

  if(!(data || []).length){

    el.innerHTML =
      '<div class="muted">Nenhuma mensagem ainda. Comece a conversa.</div>';

  }

  el.scrollTop = el.scrollHeight;
}

async function sendMessage(){

  const input = document.getElementById('messageInput');

  const body = input.value.trim();

  if(!body || !conversation) return;

  input.disabled = true;

  const { error } = await marketplaceDb
    .from('marketplace_messages')
    .insert({
      conversation_id: conversation.id,
      sender_id: user.id,
      body: body
    });

  input.disabled = false;

  if(error){
    alert(error.message);
    return;
  }

  input.value = '';

  await marketplaceDb
    .from('marketplace_conversations')
    .update({
      updated_at: new Date().toISOString()
    })
    .eq('id', conversation.id);

  await loadMessages();

  input.focus();
}

document.addEventListener('keydown', e => {

  if(
    e.key === 'Enter' &&
    document.activeElement?.id === 'messageInput'
  ){
    sendMessage();
  }

});

</script>

</body>
</html>
