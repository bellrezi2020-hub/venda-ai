<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu perfil — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261014-0100"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="favoritos.html">Favoritos</a><a href="minhas-negociacoes.html">Negociações</a><a href="notificacoes.html">Notificações</a></nav></header><main class="wrap section"><div class="section-head"><div><h1>Meu perfil</h1><div class="muted">Seus dados na VendaAI.</div></div></div><div id="status" class="notice">Carregando...</div><div class="grid g2 section"><section class="card"><h2>Dados pessoais</h2><div class="field"><label>Nome</label><input id="name" class="input"></div><div class="field"><label>Tipo de conta</label><select id="type" class="input"><option value="person">Pessoa física</option><option value="business">Empresa</option><option value="provider">Prestador de serviço</option></select></div><div class="form-grid"><div class="field"><label>Cidade</label><input id="city" class="input"></div><div class="field"><label>Estado</label><input id="state" class="input" maxlength="2"></div></div><button class="btn" style="margin-top:14px" onclick="saveProfile()">Salvar perfil</button><p id="msg" class="muted"></p></section><section class="card"><h2>Reputação</h2><div id="rating" class="kpi">—</div><div id="reviews" class="muted">Carregando avaliações...</div><div class="divider"></div><h3>Lojas que sigo</h3><div id="following" class="muted">Carregando...</div></section></div></main><script>
let user=null,profile=null;
(async()=>{try{user=await MP.requireUser('perfil.html');if(!user)return;profile=await MP.profileFor(user.id);if(!profile){profile={user_id:user.id,display_name:user.email?.split('@')[0]||'Usuário',account_type:'person',city:'',state:'RS',email_verified:true};const r=await marketplaceDb.from('marketplace_profiles').insert(profile).select().single();if(r.error)throw r.error;profile=r.data}name.value=profile.display_name||'';type.value=profile.account_type||'person';city.value=profile.city||'';state.value=profile.state||'RS';await Promise.all([loadRating(),loadFollowing()]);const s=document.getElementById('status');s.className='notice ok';s.textContent='✓ Perfil carregado.'}catch(e){const s=document.getElementById('status');s.className='notice warn';s.textContent=e.message||String(e)}})();
async function saveProfile(){const payload={display_name:name.value.trim(),account_type:type.value,city:city.value.trim(),state:state.value.trim().toUpperCase(),updated_at:new Date().toISOString()};if(!payload.display_name)return msg.textContent='Informe seu nome.';const{error}=await marketplaceDb.from('marketplace_profiles').update(payload).eq('user_id',user.id);msg.textContent=error?error.message:'✓ Perfil salvo.'}
async function loadRating(){const{data,error}=await marketplaceDb.from('marketplace_reviews').select('rating,role,comment').eq('reviewed_user_id',user.id);if(error){reviews.textContent=error.message;return}const a=data||[];const avg=a.length?a.reduce((s,x)=>s+Number(x.rating||0),0)/a.length:0;rating.textContent=a.length?'⭐ '+avg.toFixed(1):'Sem avaliações';reviews.textContent=a.length?a.length+' avaliação(ões) recebida(s).':'Sua reputação aparecerá depois de negociações avaliadas.'}
async function loadFollowing(){const{data,error}=await marketplaceDb.from('marketplace_store_followers').select('store_id,marketplace_stores(id,name,city,state,rating)').eq('user_id',user.id);if(error){following.textContent=error.message;return}following.innerHTML=(data||[]).map(x=>'<div class="list-item"><a href="loja.html?id='+encodeURIComponent(x.store_id)+'"><strong>'+MP.esc(x.marketplace_stores?.name||'Loja')+'</strong></a><div class="muted">'+MP.esc([x.marketplace_stores?.city,x.marketplace_stores?.state].filter(Boolean).join(' - '))+' • ⭐ '+Number(x.marketplace_stores?.rating||0).toFixed(1)+'</div></div>').join('')||'Você ainda não segue nenhuma loja.'}
</script></body></html>
