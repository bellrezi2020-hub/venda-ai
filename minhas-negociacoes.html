<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhas negociações — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261014-0010"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="favoritos.html">Favoritos</a><a href="notificacoes.html">Notificações</a><a href="vendedor-painel.html">Meu painel</a></nav></header><main class="wrap section"><div class="section-head"><div><h1>Minhas negociações</h1><div class="muted">Propostas enviadas e conversas abertas.</div></div></div><div id="status" class="notice">Carregando...</div><div class="grid g2 section"><div class="card"><h2>Minhas propostas</h2><div id="offers"></div></div><div class="card"><h2>Conversas</h2><div id="conversations"></div></div></div></main><script>
let user=null,offerRows=[],conversationRows=[];
(async()=>{try{user=await MP.requireUser('minhas-negociacoes.html');if(!user)return;await Promise.all([loadOffers(),loadConversations()]);const s=document.getElementById('status');s.className='notice ok';s.textContent='✓ Negociações carregadas.'}catch(e){const s=document.getElementById('status');s.className='notice warn';s.textContent=e.message||String(e)}})();
async function loadOffers(){const{data,error}=await marketplaceDb.from('marketplace_offers').select('*,marketplace_listings(id,title,price,seller_id)').eq('buyer_id',user.id).order('created_at',{ascending:false});if(error)throw error;offerRows=data||[];document.getElementById('offers').innerHTML=offerRows.map(o=>'<div class="list-item"><strong>'+MP.esc(o.marketplace_listings?.title||'Anúncio')+'</strong><div class="muted">Sua proposta: '+MP.money(o.amount)+(o.counter_amount?' • Contraproposta: '+MP.money(o.counter_amount):'')+'</div><span class="status '+(o.status==='accepted'?'green':o.status==='rejected'?'red':'yellow')+'">'+MP.esc(o.status)+'</span><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">'+(o.status==='countered'?'<button class="btn success" onclick="answerCounter(\''+o.id+'\',\'accepted\')">Aceitar R$ '+Number(o.counter_amount||0).toLocaleString('pt-BR',{minimumFractionDigits:2})+'</button><button class="btn btn-danger" onclick="answerCounter(\''+o.id+'\',\'rejected\')">Recusar</button>':'')+'<a class="btn ghost" href="negociacao.html?listing='+encodeURIComponent(o.listing_id)+'">Conversar</a></div></div>').join('')||'<div class="muted">Você ainda não enviou propostas.</div>'}
async function answerCounter(id,status){const{error}=await marketplaceDb.from('marketplace_offers').update({status,responded_at:new Date().toISOString()}).eq('id',id).eq('buyer_id',user.id);if(error)return alert(error.message);loadOffers()}
async function loadConversations(){const[{data,error},{data:accepted,error:offerError}]=await Promise.all([marketplaceDb.from('marketplace_conversations').select('*,marketplace_listings(id,title,price,seller_id)').or('buyer_id.eq.'+user.id+',seller_id.eq.'+user.id).order('updated_at',{ascending:false}),marketplaceDb.from('marketplace_offers').select('listing_id,buyer_id,status').eq('status','accepted')]);if(error)throw error;if(offerError)throw offerError;conversationRows=data||[];const acceptedRows=accepted||[];document.getElementById('conversations').innerHTML=conversationRows.map(c=>{const sellerSide=c.seller_id===user.id;const other=sellerSide?c.buyer_id:c.seller_id;const role=sellerSide?'buyer':'seller';const canRate=acceptedRows.some(o=>o.listing_id===c.listing_id&&o.buyer_id===c.buyer_id);return '<div class="list-item"><strong>'+MP.esc(c.marketplace_listings?.title||'Negociação')+'</strong><div class="muted">'+MP.money(c.marketplace_listings?.price||0)+'</div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn ghost" href="negociacao.html?listing='+encodeURIComponent(c.listing_id)+(sellerSide?'&buyer='+encodeURIComponent(c.buyer_id):'')+'">Abrir conversa</a>'+(canRate?'<button class="btn ghost" onclick="reviewUser(\''+c.listing_id+'\',\''+other+'\',\''+role+'\')">⭐ Avaliar</button>':'')+'</div></div>'}).join('')||'<div class="muted">Nenhuma conversa aberta.</div>'}
async function reviewUser(listingId,target,role){const raw=prompt('Nota de 1 a 5:');if(raw===null)return;const rating=Number(raw);if(!Number.isInteger(rating)||rating<1||rating>5)return alert('Use uma nota de 1 a 5.');const comment=prompt('Comentário (opcional):')||'';const{error}=await marketplaceDb.from('marketplace_reviews').insert({listing_id:listingId,reviewer_id:user.id,reviewed_user_id:target,role,rating,comment});if(error)return alert(error.message);alert('Avaliação enviada.')}
</script></body></html>
