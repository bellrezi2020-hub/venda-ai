<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhas negociações — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261013-1825"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="vendedor-painel.html">Meu painel</a></nav></header><main class="wrap section"><div class="section-head"><div><h1>Minhas negociações</h1><div class="muted">Propostas enviadas e conversas abertas.</div></div></div><div id="status" class="notice">Carregando...</div><div class="grid g2 section"><div class="card"><h2>Minhas propostas</h2><div id="offers"></div></div><div class="card"><h2>Conversas</h2><div id="conversations"></div></div></div></main><script>
let user=null;
(async()=>{try{user=await MP.requireUser('minhas-negociacoes.html');if(!user)return;await Promise.all([loadOffers(),loadConversations()]);const s=document.getElementById('status');s.className='notice ok';s.textContent='✓ Negociações carregadas.'}catch(e){const s=document.getElementById('status');s.className='notice warn';s.textContent=e.message||String(e)}})();
async function loadOffers(){const{data,error}=await marketplaceDb.from('marketplace_offers').select('*,marketplace_listings(id,title,price,seller_id)').eq('buyer_id',user.id).order('created_at',{ascending:false});if(error)throw error;document.getElementById('offers').innerHTML=(data||[]).map(o=>'<div class="list-item"><strong>'+MP.esc(o.marketplace_listings?.title||'Anúncio')+'</strong><div class="muted">Sua proposta: '+MP.money(o.amount)+(o.counter_amount?' • Contraproposta: '+MP.money(o.counter_amount):'')+'</div><span class="status '+(o.status==='accepted'?'green':o.status==='rejected'?'red':'yellow')+'">'+MP.esc(o.status)+'</span><div style="margin-top:10px"><a class="btn ghost" href="negociacao.html?listing='+encodeURIComponent(o.listing_id)+'">Conversar</a></div></div>').join('')||'<div class="muted">Você ainda não enviou propostas.</div>'}
async function loadConversations(){const{data,error}=await marketplaceDb.from('marketplace_conversations').select('*,marketplace_listings(id,title,price)').or('buyer_id.eq.'+user.id+',seller_id.eq.'+user.id).order('updated_at',{ascending:false});if(error)throw error;document.getElementById('conversations').innerHTML=(data||[]).map(c=>'<div class="list-item"><strong>'+MP.esc(c.marketplace_listings?.title||'Negociação')+'</strong><div class="muted">'+MP.money(c.marketplace_listings?.price||0)+'</div><a class="btn ghost" style="margin-top:10px" href="negociacao.html?listing='+encodeURIComponent(c.listing_id)+(c.seller_id===user.id?'&buyer='+encodeURIComponent(c.buyer_id):'')+'">Abrir conversa</a></div>').join('')||'<div class="muted">Nenhuma conversa aberta.</div>'}
</script></body></html>
