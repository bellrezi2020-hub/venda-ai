<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificações — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261014-0010"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="favoritos.html">Favoritos</a><a href="minhas-negociacoes.html">Negociações</a></nav></header><main class="wrap section"><div class="section-head"><div><h1>Notificações</h1><div class="muted">Propostas, mensagens e atualizações da sua conta.</div></div><button class="btn secondary" onclick="markAll()">Marcar todas como lidas</button></div><div id="status" class="notice">Carregando...</div><div id="list" class="section"></div></main><script>
let user=null;
(async()=>{try{user=await MP.requireUser('notificacoes.html');if(!user)return;await load()}catch(e){showError(e)}})();
function showError(e){const s=document.getElementById('status');s.className='notice warn';s.textContent=e.message||String(e)}
async function load(){const{data,error}=await marketplaceDb.from('marketplace_notifications').select('*').eq('user_id',user.id).order('created_at',{ascending:false});if(error)throw error;const a=data||[];document.getElementById('list').innerHTML=a.map(n=>'<div class="card" style="margin-bottom:10px;'+(!n.is_read?'border-color:#655abd':'')+'"><div class="row"><div><strong>'+MP.esc(n.title)+'</strong><div class="muted">'+MP.esc(n.body||'')+'</div><div class="muted small">'+new Date(n.created_at).toLocaleString('pt-BR')+'</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">'+(n.link?'<a class="btn ghost" href="'+MP.esc(n.link)+'">Abrir</a>':'')+(!n.is_read?'<button class="btn secondary" onclick="markOne(\''+n.id+'\')">Marcar lida</button>':'')+'</div></div></div>').join('')||'<div class="notice">Nenhuma notificação ainda.</div>';const unread=a.filter(x=>!x.is_read).length;const s=document.getElementById('status');s.className='notice ok';s.textContent='✓ '+unread+' não lida(s).'}
async function markOne(id){const{error}=await marketplaceDb.from('marketplace_notifications').update({is_read:true}).eq('id',id).eq('user_id',user.id);if(error)return alert(error.message);load()}
async function markAll(){const{error}=await marketplaceDb.from('marketplace_notifications').update({is_read:true}).eq('user_id',user.id).eq('is_read',false);if(error)return alert(error.message);load()}
</script></body></html>
