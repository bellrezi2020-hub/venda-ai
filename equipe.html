<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VendaAI - Equipe</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><div id="nav"></div><div class="container"><h1>Equipe</h1><p class="sub">Estrutura para corretores e distribuição de leads.</p><div class="notice">Para adicionar usuários com segurança, configure <code>SUPABASE_URL</code> e <code>SUPABASE_SERVICE_ROLE_KEY</code> na Vercel. Nunca coloque a service role no GitHub.</div><div class="box" style="margin-top:18px"><label>E-mail de usuário já cadastrado</label><input id="email"><label>Nome</label><input id="nome"><button class="btn-full" onclick="vincular()">Adicionar à equipe</button><p id="msg" class="small muted" style="margin-top:10px"></p></div><div class="box"><h2>Equipe atual</h2><div id="lista"></div></div></div><script>document.getElementById('nav').innerHTML=nav('equipe');let c;(async()=>{await requireAuth();c=await currentCompany();carregar()})();async function vincular(){const r=await fetch('/api/add-member',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({companyId:c.id,email:email.value.trim(),fullName:nome.value.trim()})});const d=await r.json();msg.textContent=d.ok?'Usuário vinculado.':d.erro;carregar()}async function carregar(){const {data}=await supabaseClient.from('company_members').select('role,user_id,profiles:user_id(full_name,email)').eq('company_id',c.id);lista.innerHTML=(data||[]).map(m=>`<div class="list-item"><strong>${esc(m.profiles?.full_name||'Sem nome')}</strong><p class="muted small">${esc(m.profiles?.email||'')} • ${esc(m.role)}</p></div>`).join('')||'<p class="muted">Nenhum membro.</p>'}</script></body></html>
