<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VendaAI - Leads</title><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
</head><body><div id="nav"></div><div class="container">
<h1>Leads</h1><p class="sub">Analise mensagens, encontre matches e acompanhe o funil.</p>
<div class="box">
<label>Nome do cliente</label><input id="nome" placeholder="Ex: João">
<label>Mensagem do cliente</label><textarea id="mensagem" placeholder="Ex: Procuro uma casa..."></textarea>
<button id="btn" class="btn-full" onclick="analisar()">🤖 Analisar cliente</button>
<div id="resultado"></div></div>
<div class="box"><div class="row"><h2>Histórico</h2><select id="filtro" style="width:auto;margin:0" onchange="carregar()"><option>Todos</option><option>Quente</option><option>Morno</option><option>Frio</option></select></div><div id="lista"></div></div>
</div>
<script>
document.getElementById("nav").innerHTML=nav("leads");let company;
(async()=>{await requireAuth();company=await currentCompany();if(!company){alert("Cadastre a empresa primeiro.");location.href="empresa.html";return}carregar()})();
async function analisar(){
 if(!mensagem.value.trim()){alert("Digite a mensagem.");return}
 btn.disabled=true;btn.textContent="Analisando...";resultado.innerHTML='<div class="list-item">🤖 Analisando...</div>';
 const {data:props}=await supabaseClient.from("properties").select("*").eq("company_id",company.id);
 const r=await fetch("/api/analisar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nome:nome.value.trim()||"Cliente",mensagem:mensagem.value.trim(),empresa:company,imoveis:props||[]})});
 const d=await r.json();btn.disabled=false;btn.textContent="🤖 Analisar cliente";
 if(!r.ok){resultado.innerHTML=`<div class="list-item danger">${esc(d.erro||"Erro")}</div>`;return}
 resultado.innerHTML=`<div class="list-item"><strong>🔥 Temperatura</strong><div class="${normalizar(d.status)}">${esc(d.status)}</div></div>
 <div class="list-item"><strong>🎯 Intenção</strong><p>${esc(d.intencao)}</p></div>
 ${d.imoveisCompativeis?.length?`<div class="list-item"><strong>🏠 Imóveis compatíveis</strong>${d.imoveisCompativeis.map(x=>`<p style="margin-top:8px"><span class="success">${esc(x.titulo)}</span><br>${esc(x.motivo)}</p>`).join("")}</div>`:""}
 <div class="list-item"><strong>💬 Resposta sugerida</strong><p>${esc(d.resposta)}</p></div><div class="list-item"><strong>➡️ Próximo passo</strong><p>${esc(d.proximoPasso)}</p></div>`;
 const {data:lead,error}=await supabaseClient.from("leads").insert({
   company_id:company.id,name:nome.value.trim()||"Cliente",original_message:mensagem.value.trim(),temperature:d.status,intent:d.intencao,
   suggested_reply:d.resposta,next_step:d.proximoPasso,status:"Novo",match_count:d.imoveisCompativeis?.length||0,matches:d.imoveisCompativeis||[]
 }).select().single();
 if(error){alert(error.message);return}carregar();
}
async function carregar(){
 let q=supabaseClient.from("leads").select("*").eq("company_id",company.id).order("created_at",{ascending:false});
 if(filtro.value!=="Todos")q=q.eq("temperature",filtro.value);
 const {data,error}=await q;if(error){lista.innerHTML=esc(error.message);return}
 if(!data.length){lista.innerHTML='<div class="muted" style="padding:20px;text-align:center">Nenhum lead.</div>';return}
 lista.innerHTML=data.map(l=>`<a href="lead.html?id=${l.id}" class="list-item" style="display:block;text-decoration:none">
 <div class="row"><div><strong>${esc(l.name)}</strong><div class="${normalizar(l.temperature)}">${esc(l.temperature)}</div></div><span class="badge">${esc(l.status)}</span></div>
 <p class="muted" style="margin-top:8px">${esc(l.intent||"")}</p><p class="small muted" style="margin-top:8px">${new Date(l.created_at).toLocaleString("pt-BR")}</p></a>`).join("");
}
</script></body></html>
