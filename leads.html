<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VendaAI - Leads</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><div id="nav"></div><div class="container"><h1>Leads</h1><p class="sub">Analise e acompanhe o funil.</p><div class="box"><label>Nome</label><input id="nome"><label>Mensagem</label><textarea id="mensagem"></textarea><button id="btn" class="btn-full" onclick="analisar()">🤖 Analisar cliente</button><div id="resultado"></div></div><div class="box"><div class="grid-3"><div><label>Temperatura</label><select id="fTemp" onchange="carregar()"><option>Todos</option><option>Quente</option><option>Morno</option><option>Frio</option></select></div><div><label>Status</label><select id="fStatus" onchange="carregar()"><option>Todos</option><option>Novo</option><option>Em contato</option><option>Aguardando confirmação de visita</option><option>Visita marcada</option><option>Fechado</option><option>Perdido</option></select></div><div><label>Busca</label><input id="fBusca" oninput="carregar()"></div></div><div id="lista"></div></div></div><script>document.getElementById('nav').innerHTML=nav('leads');let c;(async()=>{await requireAuth();c=await currentCompany();if(!c){location.href='empresa.html';return}carregar()})();async function analisar(){if(!mensagem.value.trim())return;btn.disabled=true;const {data:props}=await supabaseClient.from('properties').select('*').eq('company_id',c.id);const r=await fetch('/api/analisar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:nome.value.trim()||'Cliente',mensagem:mensagem.value.trim(),empresa:c,imoveis:props||[]})});const d=await r.json();btn.disabled=false;if(!r.ok){resultado.innerHTML=`<div class="list-item danger">${esc(d.erro)}</div>`;return}resultado.innerHTML=`<div class="list-item"><div class="${normalizar(d.status)}">${esc(d.status)}</div><p>${esc(d.intencao)}</p></div>`;await supabaseClient.from('leads').insert({company_id:c.id,name:nome.value.trim()||'Cliente',original_message:mensagem.value.trim(),temperature:d.status,intent:d.intencao,suggested_reply:d.resposta,next_step:d.proximoPasso,status:'Novo',match_count:d.imoveisCompativeis?.length||0,matches:d.imoveisCompativeis||[],last_activity_at:new Date().toISOString()});carregar()}async function carregar(){let q=supabaseClient.from('leads').select('*').eq('company_id',c.id).order('created_at',{ascending:false});if(fTemp.value!=='Todos')q=q.eq('temperature',fTemp.value);if(fStatus.value!=='Todos')q=q.eq('status',fStatus.value);const {data}=await q;const t=fBusca.value.trim().toLowerCase();const a=(data||[]).filter(l=>!t||[l.name,l.intent].some(v=>String(v||'').toLowerCase().includes(t)));lista.innerHTML=a.map(l=>`<a class="list-item" href="lead.html?id=${l.id}" style="display:block;text-decoration:none"><div class="row"><div><strong>${esc(l.name)}</strong><div class="${normalizar(l.temperature)}">${esc(l.temperature)}</div></div><span class="badge">${esc(l.status)}</span></div><p class="muted small" style="margin-top:8px">${esc(l.intent||'')}</p></a>`).join('')||'<p class="muted">Nenhum lead.</p>'}</script></body></html>
