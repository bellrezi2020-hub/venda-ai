<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VendaAI - Imóveis</title><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
</head><body><div id="nav"></div><div class="container">
<h1>Imóveis</h1><p class="sub">Catálogo usado pela IA para encontrar matches.</p>
<div class="box"><div class="grid-2">
<div><label>Título</label><input id="titulo"></div>
<div><label>Tipo</label><select id="tipo"><option>Casa</option><option>Apartamento</option><option>Terreno</option><option>Comercial</option></select></div>
<div><label>Finalidade</label><select id="finalidade"><option>Compra</option><option>Aluguel</option></select></div>
<div><label>Preço</label><input id="preco" type="number"></div>
<div><label>Bairro</label><input id="bairro"></div><div><label>Cidade</label><input id="cidade"></div>
<div><label>Quartos</label><input id="quartos" type="number"></div>
<div><label>Garagem</label><select id="garagem"><option>Sim</option><option>Não</option></select></div>
</div><label>Descrição</label><textarea id="descricao"></textarea>
<button class="btn-full" onclick="adicionar()">➕ Adicionar imóvel</button></div>
<div class="box"><div class="row"><h2>Catálogo</h2><button class="btn-secondary" onclick="carregar()">Atualizar</button></div><div id="lista"></div></div>
</div>
<script>
document.getElementById("nav").innerHTML=nav("imoveis");let company;
(async()=>{await requireAuth();company=await currentCompany();if(!company){alert("Cadastre a empresa primeiro.");location.href="empresa.html";return}carregar()})();
async function adicionar(){
 if(!titulo.value.trim()||!preco.value){alert("Título e preço são obrigatórios.");return}
 const {error}=await supabaseClient.from("properties").insert({
  company_id:company.id,title:titulo.value.trim(),type:tipo.value,purpose:finalidade.value,price:Number(preco.value),
  neighborhood:bairro.value.trim(),city:cidade.value.trim(),bedrooms:Number(quartos.value||0),garage:garagem.value==="Sim",description:descricao.value.trim()
 });
 if(error){alert(error.message);return}
 titulo.value=preco.value=bairro.value=cidade.value=quartos.value=descricao.value="";carregar();
}
async function carregar(){
 const {data,error}=await supabaseClient.from("properties").select("*").eq("company_id",company.id).order("created_at",{ascending:false});
 if(error){lista.innerHTML=esc(error.message);return}
 if(!data.length){lista.innerHTML='<div class="muted" style="padding:20px;text-align:center">Nenhum imóvel cadastrado.</div>';return}
 lista.innerHTML=data.map(i=>`<div class="list-item"><div class="row"><div><h3>${esc(i.title)}</h3><div class="success">${dinheiro(i.price)}</div></div><button class="btn-danger" onclick="excluir('${i.id}')">Excluir</button></div>
 <p class="muted" style="margin-top:8px">${esc(i.type)} • ${esc(i.purpose)} • ${esc(i.neighborhood||"")} ${i.city?"- "+esc(i.city):""}</p>
 <p class="muted">${i.bedrooms||0} quartos • garagem: ${i.garage?"sim":"não"}</p><p style="margin-top:8px">${esc(i.description||"")}</p></div>`).join("");
}
async function excluir(id){if(!confirm("Excluir este imóvel?"))return;await supabaseClient.from("properties").delete().eq("id",id);carregar()}
</script></body></html>
