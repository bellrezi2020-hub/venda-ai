<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VendaAI - Imóveis</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><div id="nav"></div><div class="container"><div class="row"><div><h1>Imóveis</h1><p class="sub">Cadastre, edite e importe CSV.</p></div><button class="btn-secondary" onclick="csv.click()">Importar CSV</button><input id="csv" type="file" accept=".csv" class="hidden"></div><div class="box"><input id="editId" type="hidden"><div class="grid-2"><div><label>Título</label><input id="titulo"></div><div><label>Tipo</label><select id="tipo"><option>Casa</option><option>Apartamento</option><option>Terreno</option><option>Comercial</option></select></div><div><label>Finalidade</label><select id="finalidade"><option>Compra</option><option>Aluguel</option></select></div><div><label>Preço</label><input id="preco" type="number"></div><div><label>Bairro</label><input id="bairro"></div><div><label>Cidade</label><input id="cidade"></div><div><label>Quartos</label><input id="quartos" type="number"></div><div><label>Garagem</label><select id="garagem"><option>Sim</option><option>Não</option></select></div></div><label>Descrição</label><textarea id="descricao"></textarea><button class="btn-full" id="salvarBtn" onclick="salvarImovel()">➕ Salvar imóvel</button></div><div class="box"><div class="row"><h2>Catálogo</h2><input id="busca" placeholder="Buscar..." style="width:260px;margin:0" oninput="carregar()"></div><div id="lista"></div></div></div><script>document.getElementById('nav').innerHTML=nav('imoveis');let c;(async()=>{await requireAuth();c=await currentCompany();if(!c){location.href='empresa.html';return}carregar()})();async function salvarImovel(){if(!titulo.value.trim()||!preco.value)return alert('Título e preço obrigatórios.');const p={company_id:c.id,title:titulo.value.trim(),type:tipo.value,purpose:finalidade.value,price:Number(preco.value),neighborhood:bairro.value.trim(),city:cidade.value.trim(),bedrooms:Number(quartos.value||0),garage:garagem.value==='Sim',description:descricao.value.trim()};const {error}=editId.value?await supabaseClient.from('properties').update(p).eq('id',editId.value):await supabaseClient.from('properties').insert(p);if(error)return alert(error.message);limpar();carregar()}function limpar(){editId.value='';titulo.value=preco.value=bairro.value=cidade.value=quartos.value=descricao.value='';salvarBtn.textContent='➕ Salvar imóvel'}async function editar(id){const {data}=await supabaseClient.from('properties').select('*').eq('id',id).single();editId.value=data.id;titulo.value=data.title;tipo.value=data.type;finalidade.value=data.purpose;preco.value=data.price;bairro.value=data.neighborhood||'';cidade.value=data.city||'';quartos.value=data.bedrooms||0;garagem.value=data.garage?'Sim':'Não';descricao.value=data.description||'';salvarBtn.textContent='💾 Atualizar imóvel';scrollTo({top:0,behavior:'smooth'})}async function excluir(id){if(!confirm('Excluir imóvel?'))return;await supabaseClient.from('properties').delete().eq('id',id);carregar()}async function carregar(){const {data}=await supabaseClient.from('properties').select('*').eq('company_id',c.id).order('created_at',{ascending:false});const t=busca.value.trim().toLowerCase();const a=(data||[]).filter(i=>!t||[i.title,i.city,i.neighborhood].some(v=>String(v||'').toLowerCase().includes(t)));lista.innerHTML=a.map(i=>`<div class="list-item"><div class="row"><div><h3>${esc(i.title)}</h3><div class="success">${dinheiro(i.price)}</div></div><div><button class="btn-secondary" onclick="editar('${i.id}')">Editar</button> <button class="btn-danger" onclick="excluir('${i.id}')">Excluir</button></div></div><p class="muted small" style="margin-top:8px">${esc(i.type)} • ${esc(i.purpose)} • ${esc(i.neighborhood||'')} ${i.city?'- '+esc(i.city):''} • ${i.bedrooms||0} quartos</p></div>`).join('')||'<p class="muted">Nenhum imóvel.</p>'}csv.onchange=async e=>{const f=e.target.files[0];if(!f)return;const txt=await f.text();const lines=txt.split(/\r?\n/).filter(Boolean);const h=lines.shift().split(',').map(x=>x.trim());const rows=lines.map(line=>{const v=line.split(',');const o={};h.forEach((k,i)=>o[k]=v[i]?.trim()||'');return {company_id:c.id,title:o.titulo||o.title,type:o.tipo||o.type,purpose:o.finalidade||o.purpose,price:Number(o.preco||o.price||0),neighborhood:o.bairro||o.neighborhood,city:o.cidade||o.city,bedrooms:Number(o.quartos||o.bedrooms||0),garage:String(o.garagem||o.garage).toLowerCase().startsWith('s')||String(o.garage).toLowerCase()==='true',description:o.descricao||o.description}}).filter(x=>x.title&&x.price);const {error}=await supabaseClient.from('properties').insert(rows);alert(error?error.message:`${rows.length} imóveis importados.`);carregar()}</script></body></html>
