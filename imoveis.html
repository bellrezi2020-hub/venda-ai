<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VendaAI - Imóveis</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
<div id="nav"></div>

<div class="container">
<div class="row">
<div>
<h1>Imóveis</h1>
<p class="sub">Cadastre, edite e importe CSV.</p>
</div>
<button class="btn-secondary" onclick="document.getElementById('csv').click()">Importar CSV</button>
<input id="csv" type="file" accept=".csv" class="hidden">
</div>

<div class="box">
<input id="editId" type="hidden">

<div class="grid-2">
<div><label>Título</label><input id="titulo"></div>
<div><label>Tipo</label><select id="tipo"><option>Casa</option><option>Apartamento</option><option>Terreno</option><option>Comercial</option></select></div>
<div><label>Finalidade</label><select id="finalidade"><option>Compra</option><option>Aluguel</option></select></div>
<div><label>Preço</label><input id="preco" type="number"></div>
<div><label>Bairro</label><input id="bairro"></div>
<div><label>Cidade</label><input id="cidade"></div>
<div><label>Quartos</label><input id="quartos" type="number"></div>
<div><label>Garagem</label><select id="garagem"><option>Sim</option><option>Não</option></select></div>
</div>

<label>Descrição</label>
<textarea id="descricao"></textarea>
<button class="btn-full" id="salvarBtn" onclick="salvarImovel()">➕ Salvar imóvel</button>
</div>

<div class="box">
<div class="row">
<h2>Catálogo</h2>
<input id="busca" placeholder="Buscar..." style="width:260px;margin:0" oninput="carregar()">
</div>
<div id="lista"></div>
</div>
</div>

<script>
let ctx = null;

const el = id => document.getElementById(id);

(async()=>{
  ctx = await renderNav("imoveis");
  if(!ctx || !requireOwner(ctx)) return;
  if(!ctx.company){
    location.href = "empresa.html";
    return;
  }
  await carregar();
})();

async function salvarImovel(){
  if(!ctx?.isOwner) return;

  if(!el("titulo").value.trim() || !el("preco").value)
    return alert("Título e preço obrigatórios.");

  const p = {
    company_id: ctx.company.id,
    title: el("titulo").value.trim(),
    type: el("tipo").value,
    purpose: el("finalidade").value,
    price: Number(el("preco").value),
    neighborhood: el("bairro").value.trim(),
    city: el("cidade").value.trim(),
    bedrooms: Number(el("quartos").value || 0),
    garage: el("garagem").value === "Sim",
    description: el("descricao").value.trim()
  };

  const q = el("editId").value
    ? supabaseClient.from("properties").update(p).eq("id",el("editId").value).eq("company_id",ctx.company.id)
    : supabaseClient.from("properties").insert(p);

  const {error} = await q;
  if(error) return alert(error.message);

  limpar();
  carregar();
}

function limpar(){
  el("editId").value = "";
  ["titulo","preco","bairro","cidade","quartos","descricao"].forEach(id=>el(id).value="");
  el("salvarBtn").textContent = "➕ Salvar imóvel";
}

async function editar(id){
  if(!ctx?.isOwner) return;

  const {data,error} = await supabaseClient
    .from("properties")
    .select("*")
    .eq("id",id)
    .eq("company_id",ctx.company.id)
    .single();

  if(error || !data) return alert("Imóvel não encontrado.");

  el("editId").value=data.id;
  el("titulo").value=data.title||"";
  el("tipo").value=data.type||"Casa";
  el("finalidade").value=data.purpose||"Compra";
  el("preco").value=data.price||"";
  el("bairro").value=data.neighborhood||"";
  el("cidade").value=data.city||"";
  el("quartos").value=data.bedrooms||0;
  el("garagem").value=data.garage?"Sim":"Não";
  el("descricao").value=data.description||"";
  el("salvarBtn").textContent="💾 Atualizar imóvel";
  scrollTo({top:0,behavior:"smooth"});
}

async function excluir(id){
  if(!ctx?.isOwner) return;
  if(!confirm("Excluir imóvel?")) return;

  const {error} = await supabaseClient
    .from("properties")
    .delete()
    .eq("id",id)
    .eq("company_id",ctx.company.id);

  if(error) return alert(error.message);
  carregar();
}

async function carregar(){
  const {data,error} = await supabaseClient
    .from("properties")
    .select("*")
    .eq("company_id",ctx.company.id)
    .order("created_at",{ascending:false});

  if(error){
    el("lista").innerHTML=`<p class="danger">${esc(error.message)}</p>`;
    return;
  }

  const t=el("busca").value.trim().toLowerCase();
  const a=(data||[]).filter(i=>!t||[i.title,i.city,i.neighborhood]
    .some(v=>String(v||"").toLowerCase().includes(t)));

  el("lista").innerHTML=a.map(i=>`
    <div class="list-item">
      <div class="row">
        <div>
          <h3>${esc(i.title)}</h3>
          <div class="success">${dinheiro(i.price)}</div>
        </div>
        <div>
          <button class="btn-secondary" onclick="editar('${i.id}')">Editar</button>
          <button class="btn-danger" onclick="excluir('${i.id}')">Excluir</button>
        </div>
      </div>
      <p class="muted small" style="margin-top:8px">
        ${esc(i.type)} • ${esc(i.purpose)} • ${esc(i.neighborhood||"")}
        ${i.city?"- "+esc(i.city):""} • ${i.bedrooms||0} quartos
      </p>
    </div>
  `).join("") || '<p class="muted">Nenhum imóvel.</p>';
}

el("csv").onchange=async e=>{
  if(!ctx?.isOwner) return;

  const f=e.target.files[0];
  if(!f) return;

  const txt=await f.text();
  const lines=txt.split(/\r?\n/).filter(Boolean);
  if(lines.length<2) return alert("CSV vazio ou inválido.");

  const h=lines.shift().split(",").map(x=>x.trim());

  const rows=lines.map(line=>{
    const v=line.split(",");
    const o={};
    h.forEach((k,i)=>o[k]=v[i]?.trim()||"");

    return {
      company_id:ctx.company.id,
      title:o.titulo||o.title,
      type:o.tipo||o.type,
      purpose:o.finalidade||o.purpose,
      price:Number(o.preco||o.price||0),
      neighborhood:o.bairro||o.neighborhood,
      city:o.cidade||o.city,
      bedrooms:Number(o.quartos||o.bedrooms||0),
      garage:String(o.garagem||o.garage).toLowerCase().startsWith("s") ||
             String(o.garage).toLowerCase()==="true",
      description:o.descricao||o.description
    };
  }).filter(x=>x.title&&x.price);

  const {error}=await supabaseClient.from("properties").insert(rows);
  alert(error?error.message:`${rows.length} imóveis importados.`);
  if(!error) carregar();
};
</script>
</body>
</html>
