<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendar serviço — VendaAI</title><link rel="stylesheet" href="marketplace.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="marketplace-client.js?v=20261014-0630"></script></head><body><header class="mp-header"><a class="mp-logo" href="index.html">Venda<span>AI</span></a><nav class="mp-nav"><a href="marketplace.html">Explorar</a><a href="minhas-reservas.html">Minhas reservas</a><a href="notificacoes.html">Notificações</a></nav></header><main class="wrap section"><div id="status" class="notice">Carregando horários...</div><section id="area" class="section hidden"><div class="split"><div class="card"><h1 id="title">Agendar</h1><p class="muted" id="seller"></p><div id="slots"></div></div><aside class="card sticky-card"><h3>Reserva protegida</h3><p class="muted">Escolha o horário e confirme dentro da VendaAI. O contato externo continua oculto antes da confirmação.</p><div class="trust"><span>📅 Histórico da reserva</span><span>⭐ Avaliação após atendimento</span><span>🛡️ Registro na plataforma</span></div></aside></div></section></main><script>
let user=null,listing=null;
const fmt=v=>new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
(async()=>{try{user=await MP.requireUser(location.pathname.split('/').pop()+location.search);if(!user)return;const id=new URLSearchParams(location.search).get('listing');if(!id)throw new Error('Serviço não informado.');const{data,error}=await marketplaceDb.from('marketplace_listings').select('*,marketplace_stores(*)').eq('id',id).eq('status','active').maybeSingle();if(error||!data)throw error||new Error('Serviço não encontrado.');if(data.category!=='services')throw new Error('Este anúncio não é um serviço agendável.');if(data.seller_id===user.id)throw new Error('Você não pode reservar o próprio serviço.');listing=data;title.textContent=data.title;seller.textContent=(data.marketplace_stores?.public_name||data.marketplace_stores?.name||'Prestador')+' • '+[data.city,data.state].filter(Boolean).join(' - ');await loadSlots();document.getElementById('area').classList.remove('hidden');const s=document.getElementById('status');s.className='notice ok';s.textContent='✓ Escolha um horário disponível.'}catch(e){const s=document.getElementById('status');s.className='notice warn';s.textContent=e.message||String(e)}})();
async function loadSlots(){const{data,error}=await marketplaceDb.from('marketplace_availability_slots').select('*').eq('listing_id',listing.id).eq('status','available').gte('starts_at',new Date().toISOString()).order('starts_at',{ascending:true});if(error)throw error;slots.innerHTML=(data||[]).map(s=>'<div class="list-item row"><div><strong>'+fmt(s.starts_at)+'</strong><div class="muted">até '+fmt(s.ends_at)+'</div></div><button class="btn" onclick="book(\''+s.id+'\')">Reservar</button></div>').join('')||'<div class="notice">Ainda não há horários disponíveis. Você pode conversar com o prestador e pedir que ele abra um horário.</div>'}
async function book(slotId){const note=prompt('Quer deixar uma observação para o prestador? (opcional)')||'';const{data,error}=await marketplaceDb.rpc('vendaai_create_booking',{p_listing_id:listing.id,p_slot_id:slotId,p_buyer_note:note});if(error)return alert(error.message);alert('Reserva solicitada! O prestador recebeu uma notificação.');location.href='minhas-reservas.html'}
</script></body></html>
